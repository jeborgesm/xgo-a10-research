name: GP2040-CE XGO Test48 Contra telemetry build

on:
  workflow_dispatch:
  push:
    branches:
      - research-gp2040ce-xgo-integration
    paths:
      - '.github/workflows/gp2040ce-xgo-test48-right-fire-phantom-diag.yml'
      - 'integrations/gp2040ce-xgo-test01/candidates/test48-right-fire-phantom-diag/**'
      - 'integrations/gp2040ce-xgo-test01/diagnostics/**'
      - 'integrations/gp2040ce-xgo-test01/tests/test48_right_fire_no_phantom.py'
      - 'integrations/gp2040ce-xgo-test01/tests/test14_snapshot_contract_model.py'
      - 'integrations/gp2040ce-xgo-test01/tests/test26_controls_static.py'
      - 'integrations/gp2040ce-xgo-test01/tests/test26_process_behavior.cpp'

permissions:
  contents: read
  statuses: write

jobs:
  test-and-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate clean physical-button candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('integrations/gp2040ce-xgo-test01/candidates/test48-right-fire-phantom-diag/XGODriver.cpp')
          s=p.read_text()
          assert 'const bool hk_slot0 = (mask & 1u) != 0;' in s
          assert 'while ((uint32_t)(time_us_32() - low_start) < 3u) {}' in s
          assert 'constexpr uint32_t ATTACK_PULSE_US = 18000;' in s
          assert 'const uint16_t rising = attacks & ~previous_physical_attacks;' in s
          assert 'pending_press_edges.fetch_or(rising' in s
          assert 'const uint16_t mask = (physical & ~ATTACK_BITS) | attack_pulse_mask;' in s
          assert 'xgo_diag_right_attack_attempts.fetch_add' in s
          assert 'xgo_diag_right_attack_failures.fetch_add' in s
          assert 'xgo_diag_clock_low_failures.fetch_add' in s
          assert 'xgo_diag_clock_high_failures.fetch_add' in s
          assert 'clock_high_failure = true' in s
          assert 'if (!wait_clock(true, EDGE_TIMEOUT_US)) { clock_timeout = true; clock_high_failure = true; failed_slot = slot;' in s
          assert 'if (!wait_clock(true, EDGE_TIMEOUT_US)) { clock_timeout = true; clock_low_failure = true;' not in s
          assert 'constexpr uint32_t EDGE_TIMEOUT_US = 18;' in s
          assert 'constexpr uint32_t ATTACK_PULSE_US = 18000;' in s
          assert 'if (!wait_clock(false, EDGE_TIMEOUT_US))' in s
          assert 'const uint16_t snapshot = map_mask(gamepad);' in s
          for forbidden in ('hk_sequence','Sequencer','xgo_hk_phase_state','xgo_hk_repeat_state','swallow_trigger_until_release'):
              assert forbidden not in s, forbidden
          print('Test48 press-edge 18ms window DATA setup, preserved HK and no-Ken-bot checks passed')
          PY
          python3 integrations/gp2040ce-xgo-test01/tests/test48_right_fire_no_phantom.py
          python3 integrations/gp2040ce-xgo-test01/tests/test14_snapshot_contract_model.py
          python3 integrations/gp2040ce-xgo-test01/tests/test14_phy_transaction_model.py
          python3 integrations/gp2040ce-xgo-test01/tests/test14_consecutive_load_model.py
          python3 integrations/gp2040ce-xgo-test01/tests/test14_temporal_rearm_model.py
          python3 integrations/gp2040ce-xgo-test01/tests/test14_host_waveform_model.py
          python3 integrations/gp2040ce-xgo-test01/tests/test14_multiframe_fault_classifier.py
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi python3 python3-pip protobuf-compiler
      - name: Clone pinned firmware and SDK
        run: |
          git clone https://github.com/OpenStickCommunity/GP2040-CE.git upstream
          git -C upstream checkout 3d1f32f7d02d418826b725b60208278d3be878c3
          git -C upstream submodule update --init --recursive
          git clone --branch 2.3.1 --depth 1 https://github.com/raspberrypi/pico-sdk.git pico-sdk
          git -C pico-sdk submodule update --init --recursive
      - name: Apply and audit protected Test14 overlay
        run: |
          python3 integrations/gp2040ce-xgo-test01/preflight.py upstream
          python3 integrations/gp2040ce-xgo-test01/apply.py upstream
          python3 integrations/gp2040ce-xgo-test01/validate_generated_headers.py upstream
          python3 integrations/gp2040ce-xgo-test01/audit_test14.py upstream
          cmp integrations/gp2040ce-xgo-test01/src/drivers/xgo/XGODriver.cpp upstream/src/drivers/xgo/XGODriver.cpp
      - name: Substitute isolated Test48 only in temporary checkout
        run: |
          cp integrations/gp2040ce-xgo-test01/candidates/test48-right-fire-phantom-diag/XGODriver.cpp upstream/src/drivers/xgo/XGODriver.cpp
          cmp integrations/gp2040ce-xgo-test01/candidates/test48-right-fire-phantom-diag/XGODriver.cpp upstream/src/drivers/xgo/XGODriver.cpp
      - name: Install read-only OLED diagnostics overlay
        run: |
          cp integrations/gp2040ce-xgo-test01/candidates/test48-right-fire-phantom-diag/ButtonLayoutScreen.cpp upstream/src/display/ui/screens/ButtonLayoutScreen.cpp
          cp integrations/gp2040ce-xgo-test01/candidates/test48-right-fire-phantom-diag/XGODiagnostics.h upstream/headers/drivers/xgo/XGODiagnostics.h
          grep -q 'XGO48 CONTRA DIAG' upstream/src/display/ui/screens/ButtonLayoutScreen.cpp
      - name: Verify original LED shortcut remains intact
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('upstream/src/addons/neopicoleds.cpp')
          s=p.read_text()
          assert s.count('else if (gamepad->pressedR1())') == 1, 'original LED shortcut missing'
          assert 'inputMode != INPUT_MODE_XGO && gamepad->pressedR1()' not in s
          print('Original SELECT+START+R1 LED shortcut retained in XGO mode')
          PY
      # Dedicated clean-controller CI; push to this workflow triggers validation.
      - name: Compile candidate
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
          GP2040_BOARDCONFIG: Pico
        run: |
          cmake -S upstream -B upstream/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build upstream/build --parallel 2
      - name: Package clearly labeled offline-only artifact
        run: |
          mkdir -p xgo-test48-offline
          find upstream/build -name '*.uf2' -type f -exec cp -t xgo-test48-offline/ {} +
          test "$(find xgo-test48-offline -maxdepth 1 -name '*.uf2' -type f | wc -l)" -eq 1
          python3 - <<'PY'
          from pathlib import Path
          files=list(Path('xgo-test48-offline').glob('*.uf2'))
          assert len(files)==1, f'Expected one UF2, got {len(files)}'
          raw=files[0].read_bytes()
          assert len(raw)>=512 and len(raw)%512==0, 'Invalid UF2 block alignment'
          for offset in range(0,len(raw),512):
              block=raw[offset:offset+512]
              assert int.from_bytes(block[0:4],'little')==0x0A324655, f'UF2 magic0 at {offset}'
              assert int.from_bytes(block[4:8],'little')==0x9E5D5157, f'UF2 magic1 at {offset}'
              assert int.from_bytes(block[508:512],'little')==0x0AB16F30, f'UF2 trailing magic at {offset}'
          print(f'UF2 structural check OK: {files[0].name}, {len(raw)//512} blocks')
          PY
          git rev-parse HEAD > xgo-test48-offline/SOURCE-COMMIT.txt
          (cd xgo-test48-offline && sha256sum ./*.uf2 > SHA256SUMS.txt)
          printf 'UNVALIDATED TEST48 OLED DIAGNOSTIC CANDIDATE - DO NOT FLASH WITHOUT REVIEW\n' > xgo-test48-offline/README-DO-NOT-FLASH.txt
      - uses: actions/upload-artifact@v4
        with:
          name: xgo-gp2040ce-test46-OFFLINE-UNVALIDATED-DO-NOT-FLASH
          path: xgo-test48-offline/

      - name: Publish verified-build status for connector retrieval
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$RESULT" = "success" ]; then STATE=success; DESCRIPTION="Test48 tests, compile and UF2 validation passed"; else STATE=failure; DESCRIPTION="Test48 build or validation failed"; fi
          export STATE DESCRIPTION
          python3 - <<'PY' > /tmp/test48-status.json
          import json, os
          print(json.dumps({"state":os.environ["STATE"],"context":"xgo-test48/verified-uf2","description":os.environ["DESCRIPTION"],"target_url":f"https://github.com/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}"}))
          PY
          curl --fail-with-body --retry 3 -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            --data-binary @/tmp/test48-status.json
