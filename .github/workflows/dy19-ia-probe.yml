name: DY19 Internet Archive probe

on:
  pull_request:
    paths:
      - '.github/workflows/dy19-ia-probe.yml'
      - 'tools/dy19/**'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Internet Archive metadata
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json, urllib.request
          ident='dy-19-firmware-2024315'
          data=json.load(urllib.request.urlopen(f'https://archive.org/metadata/{ident}', timeout=60))
          for f in data.get('files',[]):
              print(json.dumps({k:f.get(k) for k in ('name','source','format','size','md5','sha1')}, ensure_ascii=False))
          PY
      - name: Test HTTP Range support
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://ia800102.us.archive.org/20/items/dy-19-firmware-2024315/DY19Firmware2024315.img'
          curl -L --max-time 30 -sS -D range-headers.txt -H 'Range: bytes=0-511' -o range.bin "$URL"
          cat range-headers.txt
          wc -c range.bin
          xxd -l 64 range.bin
