name: DY19 Internet Archive probe

on:
  pull_request:
    paths:
      - '.github/workflows/dy19-ia-probe.yml'
      - 'tools/dy19/**'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe first MiB and locate filesystem structures
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://ia800102.us.archive.org/20/items/dy-19-firmware-2024315/DY19Firmware2024315.img'
          curl -L --max-time 30 -sS -H 'Range: bytes=0-1048575' -o first-mib.bin "$URL"
          python3 - <<'PY'
          import struct
          d=open('first-mib.bin','rb').read()
          print('size',len(d))
          for off in range(0,len(d)-512,512):
              sec=d[off:off+512]
              sig=sec[510:512]
              oem=sec[3:11]
              fs32=sec[82:90]
              fs16=sec[54:62]
              if sig==b'\x55\xaa' or b'FAT' in fs32 or b'FAT' in fs16:
                  print(hex(off), 'sig',sig.hex(),'oem',oem,'fat16',fs16,'fat32',fs32)
                  print('bpb',sec[11:64].hex())
          # MBR partition-table candidates with nonzero entries
          for off in range(0,len(d)-512,512):
              sec=d[off:off+512]
              ents=[]
              for i in range(4):
                  e=sec[446+i*16:462+i*16]
                  ptype=e[4]; start=struct.unpack_from('<I',e,8)[0]; size=struct.unpack_from('<I',e,12)[0]
                  if ptype and size: ents.append((i,hex(ptype),start,size))
              if ents: print('ptable candidate',hex(off),ents,'sig',sec[510:512].hex())
          PY
