name: DY19 Internet Archive probe

on:
  pull_request:
    paths:
      - '.github/workflows/dy19-ia-probe.yml'
      - 'tools/dy19/**'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Internet Archive metadata
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json, urllib.request
          ident='dy-19-firmware-2024315'
          url=f'https://archive.org/metadata/{ident}'
          data=json.load(urllib.request.urlopen(url, timeout=60))
          print('identifier:', data.get('metadata',{}).get('identifier'))
          print('title:', data.get('metadata',{}).get('title'))
          print('server:', data.get('d1'), data.get('d2'))
          print('dir:', data.get('dir'))
          print('FILES')
          for f in data.get('files',[]):
              print(json.dumps({k:f.get(k) for k in ('name','source','format','size','md5','sha1')}, ensure_ascii=False))
          PY
