name: Recover Test08 generalized scanner  
on:
  workflow_dispatch:
  push:
    branches: [research-refresh-gb-gbc-gba]
    paths:
      - tools/game_lists/extract_test08_scanner.py
      - .github/workflows/test08-loop-recovery.yml
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact HW-proven scanner
        run: |
          mkdir -p out
          python tools/game_lists/extract_test08_scanner.py --output out/test08-scanner.bin
          sha256sum out/test08-scanner.bin
          python tools/game_lists/analyze_test08_loop.py out/test08-scanner.bin | tee out/test08-loop-analysis.txt
      - uses: actions/upload-artifact@v4
        with:
          name: test08-hw-proven-scanner
          path: out/
