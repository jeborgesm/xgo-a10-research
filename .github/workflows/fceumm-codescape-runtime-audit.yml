name: FCEUmm Codescape runtime audit

on:
  workflow_dispatch:
  push:
    branches:
      - research-external-core-integration
    paths:
      - .github/workflows/fceumm-codescape-runtime-audit.yml
      - tools/multicore/native_nes/**
      - tools/multicore/xgo_minimal_environment_shim.c
      - tools/multicore/xgo_preloaded_rom_sbrk.c

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-external-core-integration

      - name: Install exact HC15xx Codescape toolchain
        run: |
          set -euxo pipefail
          url='https://cloud.maschath.de/s/dDrZN4DSgJ33E3w/download/Codescape.GNU.Tools.Package.2019.09-03-2.for.MIPS32.MTI.Bare.Metal.Ubuntu-18.04.5.x86_64.tar.gz'
          curl -fL --retry 3 --retry-delay 2 "$url" -o /tmp/codescape-mips32.tar.gz
          sudo tar -xzf /tmp/codescape-mips32.tar.gz -C /opt
          /opt/mips32-mti-elf/2019.09-03-2/bin/mips-mti-elf-gcc --version | tee toolchain-version.txt

      - name: Fetch pinned HC15xx sources
        run: |
          set -euxo pipefail
          git clone --no-checkout https://github.com/madcock/libretro-fceumm.git /tmp/fceumm
          (cd /tmp/fceumm && git checkout e6111e684e7a7761f3f1d6c80d0a825e2c8cdc7e)
          git clone --no-checkout https://github.com/madcock/libretro-common.git /tmp/libretro-common
          (cd /tmp/libretro-common && git checkout 9362316bf1da38160b324a1515bfb83e44ebd7af)
          cp tools/multicore/include/dirent.h /tmp/libretro-common/include/dirent.h

      - name: Build pinned archives with proven HC15xx settings
        run: |
          set -euxo pipefail
          tools=/opt/mips32-mti-elf/2019.09-03-2/bin
          (cd /tmp/fceumm && make clean || true && make -j2 platform=sf2000)
          (cd /tmp/libretro-common && make clean || true && make -j2 \
            CC="$tools/mips-mti-elf-gcc" AR="$tools/mips-mti-elf-ar")

      - name: Compile native XGO frontend and runtime bridge
        run: |
          set -euo pipefail
          cc=/opt/mips32-mti-elf/2019.09-03-2/bin/mips-mti-elf-gcc
          flags='-EL -march=mips32 -mtune=mips32 -msoft-float -G0 -mno-abicalls -fno-pic -ffunction-sections -fdata-sections -fno-stack-protector -O2 -DXGO_WITH_NEWLIB -Itools/multicore/include -I/tmp/libretro-common/include'
          : > native-compile.log
          compile_one() {
            src=$1
            out=$2
            echo "=== $src ===" | tee -a native-compile.log
            "$cc" $flags -c "$src" -o "$out" 2>&1 | tee -a native-compile.log
          }
          compile_one tools/multicore/native_nes/xgo_nes_native_frontend.c frontend.o
          compile_one tools/multicore/xgo_minimal_environment_shim.c environment.o
          compile_one tools/multicore/xgo_preloaded_rom_sbrk.c sbrk.o
          compile_one tools/multicore/native_nes/xgo_newlib_syscalls.c syscalls.o

      - name: Measure exact Codescape runtime closure
        run: |
          set -euxo pipefail
          tools=/opt/mips32-mti-elf/2019.09-03-2/bin
          cc="$tools/mips-mti-elf-gcc"
          nm="$tools/mips-mti-elf-nm"

          "$cc" -EL -march=mips32 -msoft-float -G0 -mno-abicalls -fno-pic \
            -r -nostartfiles \
            -Wl,--gc-sections -Wl,-e,__core_entry__ -Wl,-u,__core_entry__ \
            -Wl,-T,tools/multicore/native_nes/xgo_external_stock_services.ld \
            frontend.o environment.o sbrk.o syscalls.o \
            -Wl,--start-group \
              /tmp/fceumm/fceumm_libretro_sf2000.a \
              /tmp/libretro-common/libretro-common.a \
            -Wl,--end-group \
            -o native-before-runtime.o

          "$nm" -u native-before-runtime.o | awk '$1 == "U" {print $2}' | sort -u > before-runtime.txt

          "$cc" -EL -march=mips32 -msoft-float -G0 -mno-abicalls -fno-pic \
            -r -nostartfiles \
            -Wl,--gc-sections -Wl,-e,__core_entry__ -Wl,-u,__core_entry__ \
            -Wl,-T,tools/multicore/native_nes/xgo_external_stock_services.ld \
            frontend.o environment.o sbrk.o syscalls.o \
            -Wl,--start-group \
              /tmp/fceumm/fceumm_libretro_sf2000.a \
              /tmp/libretro-common/libretro-common.a \
              -lc -lm -lgcc \
            -Wl,--end-group \
            -o native-after-runtime.o

          "$nm" -u native-after-runtime.o | awk '$1 == "U" {print $2}' | sort -u > after-runtime.txt
          comm -23 before-runtime.txt after-runtime.txt > resolved-by-codescape.txt
          comm -13 before-runtime.txt after-runtime.txt > introduced-by-codescape.txt

          {
            echo '# Native FCEUmm exact Codescape runtime closure'
            echo
            printf 'before Codescape runtime: '; wc -l < before-runtime.txt
            printf 'after Codescape runtime:  '; wc -l < after-runtime.txt
            printf 'resolved by runtime:      '; wc -l < resolved-by-codescape.txt
            printf 'introduced by runtime:    '; wc -l < introduced-by-codescape.txt
            echo
            echo '## Remaining unresolved after -lc -lm -lgcc'
            cat after-runtime.txt
            echo
            echo '## Resolved by Codescape runtime'
            cat resolved-by-codescape.txt
            echo
            echo '## Newly introduced by Codescape runtime'
            cat introduced-by-codescape.txt
          } | tee codescape-runtime-audit.txt

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fceumm-codescape-runtime-audit
          path: |
            native-compile.log
            codescape-runtime-audit.txt
            before-runtime.txt
            after-runtime.txt
            resolved-by-codescape.txt
            introduced-by-codescape.txt
            native-before-runtime.o
            native-after-runtime.o
            toolchain-version.txt
