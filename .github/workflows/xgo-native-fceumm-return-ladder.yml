name: XGO native FCEUmm return ladder

on:
  workflow_dispatch:
  push:
    branches:
      - research-external-core-integration
    paths:
      - .github/workflows/xgo-native-fceumm-return-ladder.yml
      - tools/multicore/native_nes/xgo_nes_native_frontend.c
      - tools/multicore/native_nes/xgo_core_entry.s
      - tools/multicore/native_nes/xgo_gp_bridges.s
      - tools/multicore/native_nes/xgo_core.ld
      - tools/multicore/native_nes/xgo_external_stock_services.ld
      - tools/multicore/native_nes/xgo_newlib_syscalls.c
      - tools/multicore/native_nes/xgo_stock_gp_redirects.h
      - tools/multicore/xgo_minimal_environment_shim.c
      - tools/multicore/xgo_preloaded_rom_sbrk.c
      - tools/multicore/include/dirent.h
      - tools/multicore/probe/pack_xgoc.py
      - tools/multicore/probe/inspect_xgoc.py

jobs:
  stage:
    strategy:
      fail-fast: false
      matrix:
        stage: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-external-core-integration

      - name: Install exact HC15xx Codescape toolchain
        run: |
          set -euxo pipefail
          url='https://cloud.maschath.de/s/dDrZN4DSgJ33E3w/download/Codescape.GNU.Tools.Package.2019.09-03-2.for.MIPS32.MTI.Bare.Metal.Ubuntu-18.04.5.x86_64.tar.gz'
          curl -fL --retry 3 --retry-delay 2 "$url" -o /tmp/codescape-mips32.tar.gz
          sudo tar -xzf /tmp/codescape-mips32.tar.gz -C /opt

      - name: Fetch pinned HC15xx sources
        run: |
          set -euxo pipefail
          git clone --no-checkout https://github.com/madcock/libretro-fceumm.git /tmp/fceumm
          (cd /tmp/fceumm && git checkout e6111e684e7a7761f3f1d6c80d0a825e2c8cdc7e)
          git clone --no-checkout https://github.com/madcock/libretro-common.git /tmp/libretro-common
          (cd /tmp/libretro-common && git checkout 9362316bf1da38160b324a1515bfb83e44ebd7af)
          cp tools/multicore/include/dirent.h /tmp/libretro-common/include/dirent.h

      - name: Build pinned libraries
        run: |
          set -euxo pipefail
          tools=/opt/mips32-mti-elf/2019.09-03-2/bin
          (cd /tmp/fceumm && make clean || true && make -j2 platform=sf2000)
          (cd /tmp/libretro-common && make clean || true && make -j2 \
            CC="$tools/mips-mti-elf-gcc" AR="$tools/mips-mti-elf-ar")

      - name: Compile stage ${{ matrix.stage }} frontend
        run: |
          set -euxo pipefail
          cc=/opt/mips32-mti-elf/2019.09-03-2/bin/mips-mti-elf-gcc
          flags='-EL -march=mips32 -mtune=mips32 -msoft-float -G0 -mno-abicalls -fno-pic -ffunction-sections -fdata-sections -fno-stack-protector -O2 -DXGO_WITH_NEWLIB -DXGO_BRINGUP_RETURN_STAGE=${{ matrix.stage }} -Itools/multicore/include -I/tmp/libretro-common/include'
          "$cc" $flags -c tools/multicore/native_nes/xgo_core_entry.s -o core_entry.o
          "$cc" $flags -c tools/multicore/native_nes/xgo_gp_bridges.s -o gp_bridges.o
          "$cc" $flags -c tools/multicore/native_nes/xgo_nes_native_frontend.c -o frontend.o
          "$cc" $flags -c tools/multicore/xgo_minimal_environment_shim.c -o environment.o
          "$cc" $flags -c tools/multicore/xgo_preloaded_rom_sbrk.c -o sbrk.o
          "$cc" $flags -include tools/multicore/native_nes/xgo_stock_gp_redirects.h \
            -c tools/multicore/native_nes/xgo_newlib_syscalls.c -o syscalls.o

      - name: Link and pack stage ${{ matrix.stage }}
        run: |
          set -euxo pipefail
          tools=/opt/mips32-mti-elf/2019.09-03-2/bin
          cc="$tools/mips-mti-elf-gcc"
          nm="$tools/mips-mti-elf-nm"
          objcopy="$tools/mips-mti-elf-objcopy"

          "$cc" -EL -march=mips32 -msoft-float -G0 -mno-abicalls -fno-pic \
            -static -nostartfiles -Wl,--gc-sections \
            -Wl,-Map,stage-${{ matrix.stage }}.map \
            -Wl,-T,tools/multicore/native_nes/xgo_core.ld \
            -Wl,-T,tools/multicore/native_nes/xgo_external_stock_services.ld \
            core_entry.o gp_bridges.o frontend.o environment.o sbrk.o syscalls.o \
            -Wl,--start-group \
              /tmp/fceumm/fceumm_libretro_sf2000.a \
              /tmp/libretro-common/libretro-common.a \
              -lc -lm -lgcc \
            -Wl,--end-group \
            -o stage-${{ matrix.stage }}.elf

          "$nm" -u stage-${{ matrix.stage }}.elf > stage-${{ matrix.stage }}-undefined.txt
          test ! -s stage-${{ matrix.stage }}-undefined.txt
          "$nm" -n stage-${{ matrix.stage }}.elf > stage-${{ matrix.stage }}.nm
          "$objcopy" -O binary stage-${{ matrix.stage }}.elf stage-${{ matrix.stage }}.bin

          symbol_hex() {
            local name="$1"
            awk -v name="$name" '$3 == name { h=$1; if (length(h)>8) h=substr(h,length(h)-7); printf "0x%s\n",h; exit }' stage-${{ matrix.stage }}.nm
          }

          start=$(symbol_hex __image_start)
          entry=$(symbol_hex __core_entry__)
          image_end=$(symbol_hex __image_end)
          test "$start" = '0x87000000'
          test "$entry" = '0x87000000'

          payload_size=$(stat -c %s stage-${{ matrix.stage }}.bin)
          memory_size=$((image_end - start))
          reserved_size=$((0x87cdae00 - 0x87000000))
          (( memory_size >= payload_size ))
          (( memory_size <= reserved_size ))

          python3 tools/multicore/probe/pack_xgoc.py \
            stage-${{ matrix.stage }}.bin core-stage-${{ matrix.stage }}.xgc \
            --entry-offset 0 --memory-size "$memory_size" \
            | tee stage-${{ matrix.stage }}-pack.txt
          python3 tools/multicore/probe/inspect_xgoc.py core-stage-${{ matrix.stage }}.xgc \
            | tee stage-${{ matrix.stage }}-inspection.txt
          sha256sum stage-${{ matrix.stage }}.elf stage-${{ matrix.stage }}.bin core-stage-${{ matrix.stage }}.xgc \
            | tee stage-${{ matrix.stage }}.sha256

      - name: Upload stage ${{ matrix.stage }}
        uses: actions/upload-artifact@v4
        with:
          name: xgo-return-stage-${{ matrix.stage }}
          path: |
            core-stage-${{ matrix.stage }}.xgc
            stage-${{ matrix.stage }}.sha256
            stage-${{ matrix.stage }}-inspection.txt
            stage-${{ matrix.stage }}-pack.txt
            stage-${{ matrix.stage }}.map
            stage-${{ matrix.stage }}.nm
