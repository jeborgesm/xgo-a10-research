name: Test125 offline helper audit
on:
  push:
    branches: [research-refresh-gb-gbc-gba]
  workflow_dispatch:
jobs:
  helper-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Stage1 and Stage2 helpers
        run: |
          set -euxo pipefail
          mkdir -p /tmp/test125/stage1 /tmp/test125/stage2
          python tools/game_lists/build_test125_handheld_stage1.py --outdir /tmp/test125/stage1
          python tools/game_lists/build_test125_handheld_stage2.py --outdir /tmp/test125/stage2
          test "$(stat -c%s /tmp/test125/stage1/gb-catalog.xgc)" = 2642
          test "$(stat -c%s /tmp/test125/stage1/gbc-catalog.xgc)" = 2642
          test "$(stat -c%s /tmp/test125/stage1/gba-catalog.xgc)" = 2642
          test "$(stat -c%s /tmp/test125/stage2/gb-catalog-saf.xgc)" = 7000
          test "$(stat -c%s /tmp/test125/stage2/gbc-catalog-saf.xgc)" = 7000
          test "$(stat -c%s /tmp/test125/stage2/gba-catalog-saf.xgc)" = 7000
          sha256sum /tmp/test125/stage1/* /tmp/test125/stage2/*
