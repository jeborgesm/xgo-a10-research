name: XGO GB300 mapper lift

on:
  push:
    branches: [ research-generic-libretro-runtime ]
    paths:
      - '.github/workflows/xgo-gb300-mapper-lift.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lift:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GB300 v1 firmware binary
        run: |
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/znx-x/gb300-firmware/main/bios/bisrv.asd \
            -o gb300-bisrv.asd
          sha256sum gb300-bisrv.asd | tee sha256.txt
          stat -c '%s bytes' gb300-bisrv.asd | tee size.txt

      - name: Install MIPS binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mips-linux-gnu

      - name: Locate mapper fingerprints, resource table and xrefs
        shell: bash
        run: |
          cat > lift.py <<'PY'
          from pathlib import Path
          import hashlib, struct

          b = Path('gb300-bisrv.asd').read_bytes()
          names = [b'gpapi.bvs', b'hctml.ers', b'lk7tc.bvs', b'mczwq.ikb', b'ztrba.nec',
                   b'KeyMapInfo.kmp', b'%s/Resources/KeyMapInfo.kmp']

          def sx16(v): return v - 0x10000 if v & 0x8000 else v
          def finds(s):
              out=[]; p=0
              while True:
                  p=b.find(s,p)
                  if p<0:return out
                  out.append(p); p+=1

          print(f'file_size={len(b)}')
          print(f'sha256={hashlib.sha256(b).hexdigest()}')
          strings={s:finds(s) for s in names}
          for s,offs in strings.items():
              print(f'{s.decode()}: ' + ', '.join(f'0x{o:08x}/0x{0x80000000+o:08x}' for o in offs))

          # Locate aligned words pointing at mapper strings. These form the mapper-resource table.
          mapper_ptr_words=[]
          wanted={0x80000000+o:s for s,os in strings.items() for o in os}
          print('\n=== mapper string pointer table entries ===')
          for off in range(0,len(b)-3,4):
              w=struct.unpack_from('<I',b,off)[0]
              if w in wanted:
                  mapper_ptr_words.append((off,w,wanted[w]))
                  print(f'0x{off:08x} runtime=0x{0x80000000+off:08x} -> 0x{w:08x} {wanted[w].decode()}')

          # Search code for addresses of the pointer-table entries, not just the strings.
          targets={0x80000000+off:(f'table:{s.decode()}',off) for off,_,s in mapper_ptr_words}
          targets.update({0x80000000+o:(f'string:{s.decode()}',o) for s,os in strings.items() for o in os})
          words=struct.unpack('<'+'I'*(len(b)//4), b[:(len(b)//4)*4])
          refs=[]
          print('\n=== address materialization xrefs ===')
          for i,w in enumerate(words):
              if w>>26 != 0x0f: continue
              rt=(w>>16)&31; hi=w&0xffff
              for j in range(i+1,min(i+10,len(words))):
                  q=words[j]; op=q>>26; rs=(q>>21)&31; qrt=(q>>16)&31; lo=q&0xffff
                  if rs!=rt or qrt!=rt: continue
                  addr=None
                  if op==0x09: addr=((hi<<16)+sx16(lo))&0xffffffff
                  elif op==0x0d: addr=((hi<<16)|lo)&0xffffffff
                  if addr in targets:
                      label,_=targets[addr]
                      refs.append((i*4,label,addr))
                      print(f'code=0x{i*4:08x}/0x{0x80000000+i*4:08x} -> 0x{addr:08x} {label}')
          Path('candidate-code-offsets.txt').write_text('\n'.join(f'0x{o:08x}' for o,_,_ in refs)+'\n')
          PY
          python3 lift.py | tee mapper-fingerprints.txt

      - name: Disassemble mapper xrefs and pause-menu neighborhood
        shell: bash
        run: |
          : > mapper-disassembly.txt
          while read off; do
            [ -z "$off" ] && continue
            start=$((off - 384)); [ $start -lt 0 ] && start=0
            stop=$((off + 768))
            echo "===== candidate $off =====" >> mapper-disassembly.txt
            mips-linux-gnu-objdump -D -b binary -m mips:isa32 -EL \
              --adjust-vma=0x80000000 \
              --start-address=$((0x80000000 + start)) \
              --stop-address=$((0x80000000 + stop)) gb300-bisrv.asd >> mapper-disassembly.txt || true
          done < candidate-code-offsets.txt

          echo '===== broad pause/menu region 0x80352000..0x80357000 =====' >> mapper-disassembly.txt
          mips-linux-gnu-objdump -D -b binary -m mips:isa32 -EL --adjust-vma=0x80000000 \
            --start-address=0x80352000 --stop-address=0x80357000 gb300-bisrv.asd >> mapper-disassembly.txt

          echo '===== keymap persistence neighborhood 0x80063000..0x80067000 =====' >> mapper-disassembly.txt
          mips-linux-gnu-objdump -D -b binary -m mips:isa32 -EL --adjust-vma=0x80000000 \
            --start-address=0x80063000 --stop-address=0x80067000 gb300-bisrv.asd >> mapper-disassembly.txt

      - name: Emit focused grep report
        shell: bash
        run: |
          grep -En '806cec|80666a|80666c|80666e|slti.*0x?5|slti.*5|li.*5|\*4|sll.*0x2|addiu.*48|li.*48' mapper-disassembly.txt \
            | head -n 500 | tee mapper-focused.txt || true

      - name: Preserve analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: gb300-v1-mapper-lift
          path: |
            sha256.txt
            size.txt
            mapper-fingerprints.txt
            mapper-disassembly.txt
            mapper-focused.txt
            candidate-code-offsets.txt
          retention-days: 30
