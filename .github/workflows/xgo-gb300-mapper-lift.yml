name: XGO GB300 mapper lift

on:
  push:
    branches: [ research-generic-libretro-runtime ]
    paths:
      - '.github/workflows/xgo-gb300-mapper-lift.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lift:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GB300 v1 firmware binary
        run: |
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/znx-x/gb300-firmware/main/bios/bisrv.asd \
            -o gb300-bisrv.asd
          sha256sum gb300-bisrv.asd | tee sha256.txt
          stat -c '%s bytes' gb300-bisrv.asd | tee size.txt

      - name: Install MIPS binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mips-linux-gnu

      - name: Locate exact mapper and persistence xrefs
        shell: bash
        run: |
          cat > lift.py <<'PY'
          from pathlib import Path
          import hashlib, struct

          b = Path('gb300-bisrv.asd').read_bytes()
          def sx16(v): return v - 0x10000 if v & 0x8000 else v

          exact = {
              0x80666e58: 'KeyMap path string',
              0x806cec90: 'mapper resource table',
              0x806ced80: 'pause menu resource table',
          }
          words=struct.unpack('<'+'I'*(len(b)//4), b[:(len(b)//4)*4])
          refs=[]
          print(f'file_size={len(b)}')
          print(f'sha256={hashlib.sha256(b).hexdigest()}')
          print('\n=== exact address materialization xrefs ===')
          for i,w in enumerate(words):
              if w>>26 != 0x0f: continue
              rt=(w>>16)&31; hi=w&0xffff
              for j in range(i+1,min(i+20,len(words))):
                  q=words[j]; op=q>>26; rs=(q>>21)&31; lo=q&0xffff
                  if rs!=rt: continue
                  addr=None
                  if op in (0x08,0x09): addr=((hi<<16)+sx16(lo))&0xffffffff
                  elif op==0x0d: addr=((hi<<16)|lo)&0xffffffff
                  if addr in exact:
                      refs.append((i*4,j*4,addr,exact[addr]))
                      print(f'code=0x{i*4:08x}/0x{0x80000000+i*4:08x} second=0x{0x80000000+j*4:08x} -> 0x{addr:08x} {exact[addr]}')

          # Find all direct calls to the KeyMapInfo writer at 0x80308208.
          target=0x80308208
          jal=0x0c000000 | ((target>>2)&0x03ffffff)
          print('\n=== direct calls to KeyMapInfo writer 0x80308208 ===')
          for i,w in enumerate(words):
              if w==jal:
                  print(f'caller=0x{0x80000000+i*4:08x}')
          Path('candidate-code-offsets.txt').write_text('\n'.join(f'0x{o:08x}' for o,_,_,_ in refs)+'\n')
          PY
          python3 lift.py | tee mapper-fingerprints.txt

      - name: Disassemble mapper state machine and commit path
        shell: bash
        run: |
          : > mapper-disassembly.txt
          for range in \
            '80302800 80303000 keymap-helper' \
            '803081f0 80308320 keymap-writer' \
            '80308700 80309d50 mapper-main' \
            '8030a400 8030a620 mapper-commit'; do
            set -- $range
            echo "===== $3 0x$1..0x$2 =====" >> mapper-disassembly.txt
            mips-linux-gnu-objdump -D -b binary -m mips:isa32 -EL --adjust-vma=0x80000000 \
              --start-address=$((0x$1)) --stop-address=$((0x$2)) gb300-bisrv.asd >> mapper-disassembly.txt
          done

      - name: Emit focused mapper report
        shell: bash
        run: |
          grep -En '80308208|8030a50|8030a52|8030a57|806cec|806ced|li.*4|li.*5|li.*6|slti.*5|slti.*6|sb.*b7dc|sb.*b7c6|sw.*b75c|jal|jalr' mapper-disassembly.txt \
            | head -n 1600 | tee mapper-focused.txt || true

      - name: Preserve analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: gb300-v1-mapper-lift
          path: |
            gb300-bisrv.asd
            sha256.txt
            size.txt
            mapper-fingerprints.txt
            mapper-disassembly.txt
            mapper-focused.txt
            candidate-code-offsets.txt
          retention-days: 30
