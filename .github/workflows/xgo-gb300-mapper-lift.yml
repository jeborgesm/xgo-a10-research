name: XGO GB300 mapper lift

on:
  push:
    branches: [ research-generic-libretro-runtime ]
    paths:
      - '.github/workflows/xgo-gb300-mapper-lift.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lift:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GB300 v1 firmware binary
        run: |
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/znx-x/gb300-firmware/main/bios/bisrv.asd \
            -o gb300-bisrv.asd
          sha256sum gb300-bisrv.asd | tee sha256.txt
          stat -c '%s bytes' gb300-bisrv.asd | tee size.txt

      - name: Install MIPS binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mips-linux-gnu

      - name: Locate exact mapper and pause-table xrefs
        shell: bash
        run: |
          cat > lift.py <<'PY'
          from pathlib import Path
          import hashlib, struct

          b = Path('gb300-bisrv.asd').read_bytes()
          names = [b'gpapi.bvs', b'hctml.ers', b'lk7tc.bvs', b'mczwq.ikb', b'ztrba.nec',
                   b'KeyMapInfo.kmp', b'%s/Resources/KeyMapInfo.kmp']

          def sx16(v): return v - 0x10000 if v & 0x8000 else v
          def finds(s):
              out=[]; p=0
              while True:
                  p=b.find(s,p)
                  if p<0:return out
                  out.append(p); p+=1

          print(f'file_size={len(b)}')
          print(f'sha256={hashlib.sha256(b).hexdigest()}')
          strings={s:finds(s) for s in names}
          for s,offs in strings.items():
              print(f'{s.decode()}: ' + ', '.join(f'0x{o:08x}/0x{0x80000000+o:08x}' for o in offs))

          # Known resource-table bases established from the previous pass.
          exact = {
              0x80666e58: 'KeyMap path string',
              0x80666e65: 'KeyMapInfo.kmp string',
              0x806cec90: 'mapper resource table',
              0x806ced80: 'pause menu resource table',
              0x806ced90: 'pause menu gpapi entry',
              0x80666c84: 'gpapi.bvs string',
          }

          words=struct.unpack('<'+'I'*(len(b)//4), b[:(len(b)//4)*4])
          refs=[]
          print('\n=== exact address materialization xrefs ===')
          for i,w in enumerate(words):
              if w>>26 != 0x0f: continue
              rt=(w>>16)&31; hi=w&0xffff
              for j in range(i+1,min(i+20,len(words))):
                  q=words[j]; op=q>>26; rs=(q>>21)&31; lo=q&0xffff
                  if rs!=rt: continue
                  addr=None
                  if op in (0x08,0x09): addr=((hi<<16)+sx16(lo))&0xffffffff
                  elif op==0x0d: addr=((hi<<16)|lo)&0xffffffff
                  if addr in exact:
                      refs.append((i*4,j*4,addr,exact[addr]))
                      print(f'code=0x{i*4:08x}/0x{0x80000000+i*4:08x} second=0x{0x80000000+j*4:08x} -> 0x{addr:08x} {exact[addr]}')
          Path('candidate-code-offsets.txt').write_text('\n'.join(f'0x{o:08x}' for o,_,_,_ in refs)+'\n')
          PY
          python3 lift.py | tee mapper-fingerprints.txt

      - name: Disassemble exact mapper regions
        shell: bash
        run: |
          : > mapper-disassembly.txt
          while read off; do
            [ -z "$off" ] && continue
            start=$((off - 512)); [ $start -lt 0 ] && start=0
            stop=$((off + 1536))
            echo "===== exact candidate $off =====" >> mapper-disassembly.txt
            mips-linux-gnu-objdump -D -b binary -m mips:isa32 -EL \
              --adjust-vma=0x80000000 \
              --start-address=$((0x80000000 + start)) \
              --stop-address=$((0x80000000 + stop)) gb300-bisrv.asd >> mapper-disassembly.txt || true
          done < candidate-code-offsets.txt

          echo '===== KeyMap persistence #1 0x80302800..0x80303000 =====' >> mapper-disassembly.txt
          mips-linux-gnu-objdump -D -b binary -m mips:isa32 -EL --adjust-vma=0x80000000 \
            --start-address=0x80302800 --stop-address=0x80303000 gb300-bisrv.asd >> mapper-disassembly.txt

          echo '===== KeyMap persistence #2 0x80307f00..0x80308600 =====' >> mapper-disassembly.txt
          mips-linux-gnu-objdump -D -b binary -m mips:isa32 -EL --adjust-vma=0x80000000 \
            --start-address=0x80307f00 --stop-address=0x80308600 gb300-bisrv.asd >> mapper-disassembly.txt

          echo '===== pause table handlers 0x80308700..0x80309500 =====' >> mapper-disassembly.txt
          mips-linux-gnu-objdump -D -b binary -m mips:isa32 -EL --adjust-vma=0x80000000 \
            --start-address=0x80308700 --stop-address=0x80309500 gb300-bisrv.asd >> mapper-disassembly.txt

      - name: Emit focused mapper report
        shell: bash
        run: |
          grep -En '806ced80|80666e58|ed80|6e58|li.*4|li.*5|li.*6|slti.*4|slti.*5|slti.*6|sll.*0x2|jal|jalr|gp\)' mapper-disassembly.txt \
            | head -n 1200 | tee mapper-focused.txt || true

      - name: Preserve analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: gb300-v1-mapper-lift
          path: |
            gb300-bisrv.asd
            sha256.txt
            size.txt
            mapper-fingerprints.txt
            mapper-disassembly.txt
            mapper-focused.txt
            candidate-code-offsets.txt
          retention-days: 30
