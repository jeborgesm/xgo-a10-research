name: XGO CPS1 stock-contract build audit

on:
  push:
    branches: [ research-post-mapper-runtime ]
    paths:
      - '.github/workflows/xgo-cps1-stock-contract-audit.yml'
      - 'tools/multicore/native_cps1/patch_stock_fba_contract.py'
      - 'tools/multicore/native_cps1/xgo_cps1_native_frontend.c'
      - 'tools/multicore/native_cps1/xgo_cps1_environment.c'
      - 'tools/multicore/native_nes/**'
      - 'tools/multicore/xgo_minimal_environment_shim.c'
      - 'tools/multicore/xgo_preloaded_rom_sbrk.c'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld llvm perl

      - name: Install exact HC15xx Codescape toolchain
        run: |
          set -euxo pipefail
          url='https://cloud.maschath.de/s/dDrZN4DSgJ33E3w/download/Codescape.GNU.Tools.Package.2019.09-03-2.for.MIPS32.MTI.Bare.Metal.Ubuntu-18.04.5.x86_64.tar.gz'
          curl -fL --retry 3 --retry-delay 2 "$url" -o /tmp/codescape-mips32.tar.gz
          sudo tar -xzf /tmp/codescape-mips32.tar.gz -C /opt

      - name: Fetch pinned CPS1 and C68K sibling sources
        run: |
          set -euxo pipefail
          git clone --recursive https://github.com/madcock/fbalpha2012_cps1.git /tmp/cps1
          cd /tmp/cps1
          git checkout 5714c8dc311f4dda6e54533bc8dd901a29700635
          git submodule update --init --recursive
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/cps1-commit.txt"

          git clone https://github.com/libretro/fbalpha2012_cps2.git /tmp/cps2
          cd /tmp/cps2
          git checkout e3f3ae46f120228b74d41e2b2862f1fbf1d7eb5b
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/c68k-sibling-commit.txt"

      - name: Apply family stock-contract source patch
        run: |
          set -euxo pipefail
          python3 tools/multicore/native_cps1/patch_stock_fba_contract.py /tmp/cps1 /tmp/cps2 | tee patch-report.txt

          cd /tmp/cps1
          test -d src/cpu/c68k
          test -f src/cpu/m68000_intf.c
          test ! -f src/cpu/m68000_intf.cpp
          grep -q '^EMU_C68K = 1$' makefile.libretro
          grep -q '#define AUDIO_SAMPLERATE 22050' src/burner/libretro/libretro.cpp
          grep -q '#define AUDIO_SEGMENT_LENGTH 367' src/burner/libretro/libretro.cpp
          grep -q 'xgo_fba_stock_frameskip' src/burner/libretro/libretro.cpp
          grep -q 'C68k_Exec' src/cpu/m68000_intf.c

      - name: Build patched CPS1 archive
        run: |
          set -euxo pipefail
          cd /tmp/cps1
          mkdir -p src/dep/generated
          perl src/dep/scripts/gamelist.pl -o src/dep/generated/driverlist.h -l gamelist.txt src/burn/drv/capcom
          make -j2 platform=sf2000
          cp fbalpha2012_cps1_libretro_sf2000.a "$GITHUB_WORKSPACE/fbalpha2012_cps1_stock_contract.a"

          tools=/opt/mips32-mti-elf/2019.09-03-2/bin
          "$tools/mips-mti-elf-nm" fbalpha2012_cps1_libretro_sf2000.a > "$GITHUB_WORKSPACE/core-archive-symbols.txt"
          grep -E 'C68k_Exec|xgo_fba_stock_frameskip' "$GITHUB_WORKSPACE/core-archive-symbols.txt"
          if grep -Eq ' [UT] m68k_execute$| [UT] m68k_ICount$| [UT] m68k_init$' "$GITHUB_WORKSPACE/core-archive-symbols.txt"; then
            echo 'ERROR: Musashi symbols survived in stock-contract archive'
            exit 1
          fi

      - name: Compile XGO trace-free stock-contract runtime
        run: |
          set -euxo pipefail
          cc=/opt/mips32-mti-elf/2019.09-03-2/bin/mips-mti-elf-gcc
          flags='-EL -march=mips32 -mtune=mips32 -msoft-float -G0 -mno-abicalls -fno-pic -ffunction-sections -fdata-sections -fno-stack-protector -O2 -DXGO_WITH_NEWLIB -DXGO_STOCK_FBA_CONTRACT -Itools/multicore/include -I/tmp/cps1/src/burner/libretro/libretro-common/include'
          "$cc" $flags -c tools/multicore/native_nes/xgo_core_entry.s -o core_entry.o
          "$cc" $flags -c tools/multicore/native_nes/xgo_gp_bridges.s -o gp_bridges.o
          "$cc" $flags -c tools/multicore/native_cps1/xgo_cps1_native_frontend.c -o frontend.o
          "$cc" $flags -c tools/multicore/native_cps1/xgo_cps1_environment.c -o cps1_environment.o
          "$cc" $flags -c tools/multicore/native_nes/xgo_libretro_state.c -o state.o
          "$cc" $flags -c tools/multicore/xgo_minimal_environment_shim.c -o environment.o
          "$cc" $flags -c tools/multicore/xgo_preloaded_rom_sbrk.c -o sbrk.o
          "$cc" $flags -include tools/multicore/native_nes/xgo_stock_gp_redirects.h -c tools/multicore/native_nes/xgo_newlib_syscalls.c -o syscalls.o

      - name: Link and audit stock-contract XGOC
        run: |
          set -euxo pipefail
          tools=/opt/mips32-mti-elf/2019.09-03-2/bin
          cxx="$tools/mips-mti-elf-g++"
          nm="$tools/mips-mti-elf-nm"
          objcopy="$tools/mips-mti-elf-objcopy"

          "$cxx" -EL -march=mips32 -msoft-float -G0 -mno-abicalls -fno-pic -static -nostartfiles             -Wl,--gc-sections -Wl,-Map,xgo-cps1-stock-contract.map             -Wl,-T,tools/multicore/native_nes/xgo_core.ld             -Wl,-T,tools/multicore/native_nes/xgo_external_stock_services.ld             core_entry.o gp_bridges.o frontend.o cps1_environment.o state.o environment.o sbrk.o syscalls.o             -Wl,--start-group fbalpha2012_cps1_stock_contract.a -lstdc++ -lc -lm -lgcc -Wl,--end-group             -o xgo-cps1-stock-contract.elf

          "$nm" -u xgo-cps1-stock-contract.elf | tee undefined.txt
          test ! -s undefined.txt
          "$nm" -n xgo-cps1-stock-contract.elf > symbols.txt

          grep -q ' C68k_Exec$' symbols.txt
          grep -q ' xgo_fba_stock_frameskip$' symbols.txt
          if grep -Eq ' m68k_execute$| m68k_ICount$| m68k_init$' symbols.txt; then
            echo 'ERROR: final image still contains Musashi'
            exit 1
          fi

          "$objcopy" -O binary xgo-cps1-stock-contract.elf xgo-cps1-stock-contract.bin

          start=$((0x87000000))
          image_end_hex=$("$nm" -n xgo-cps1-stock-contract.elf | awk '$3=="__image_end"{h=$1; if(length(h)>8) h=substr(h,length(h)-7); print h; exit}')
          image_end=$((16#$image_end_hex))
          memory_size=$((image_end-start))
          reserved_size=$((0x87cdae00-0x87000000))
          (( memory_size <= reserved_size ))

          python3 tools/multicore/probe/pack_xgoc.py             xgo-cps1-stock-contract.bin core-fbalpha2012-cps1-stock-contract.xgc             --entry-offset 0 --memory-size "$memory_size"
          python3 tools/multicore/probe/inspect_xgoc.py core-fbalpha2012-cps1-stock-contract.xgc | tee inspect.txt

          {
            echo 'purpose=build-only family-stock-contract audit'
            echo 'hardware_test=NO'
            echo 'cpu_backend=C68K'
            echo 'audio_rate=22050'
            echo 'audio_segment=367'
            echo 'frameskip_source=XGO stock run_emulator gfn_frameskip'
            echo 'frameskip_sink=FBA2012 nSkipFrame -> CpsDraw suppression'
            echo 'diagnostic_io=disabled'
            echo "memory_size=$memory_size"
            echo "reserved_size=$reserved_size"
          } | tee candidate-summary.txt

          sha256sum xgo-cps1-stock-contract.elf core-fbalpha2012-cps1-stock-contract.xgc | tee output.sha256

      - name: Preserve build audit only
        uses: actions/upload-artifact@v4
        with:
          name: xgo-cps1-stock-contract-build-audit
          path: |
            cps1-commit.txt
            c68k-sibling-commit.txt
            patch-report.txt
            core-archive-symbols.txt
            fbalpha2012_cps1_stock_contract.a
            xgo-cps1-stock-contract.elf
            core-fbalpha2012-cps1-stock-contract.xgc
            xgo-cps1-stock-contract.map
            symbols.txt
            undefined.txt
            inspect.txt
            candidate-summary.txt
            output.sha256
          retention-days: 30
