name: Build XGO native Micro-USB Contra responder

on:
  push:
    branches:
      - research-rp2040-controller-adapter
    paths:
      - 'tools/rp2040-xgo-native-contra/**'
      - '.github/workflows/build-xgo-native-contra.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Fetch Pico SDK 1.5.1
        run: |
          git clone --depth 1 --branch 1.5.1 https://github.com/raspberrypi/pico-sdk.git "$RUNNER_TEMP/pico-sdk"
          git -C "$RUNNER_TEMP/pico-sdk" submodule update --init --recursive
      - name: Configure
        env:
          PICO_SDK_PATH: ${{ runner.temp }}/pico-sdk
        run: cmake -S tools/rp2040-xgo-native-contra -B build/native-contra -G Ninja -DPICO_BOARD=pico -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/native-contra
      - name: Prove no TinyUSB/USB stdio link
        run: |
          ! grep -R -E 'tud_init|tusb_init|stdio_usb_init' build/native-contra/*.map
      - name: Hash candidate
        run: sha256sum build/native-contra/xgo_native_contra.uf2
      - uses: actions/upload-artifact@v4
        with:
          name: xgo-native-microusb-contra
          path: |
            build/native-contra/xgo_native_contra.uf2
            build/native-contra/xgo_native_contra.elf
            build/native-contra/xgo_native_contra.map
