name: XGO native CPS1 Core #3 audit

on:
  push:
    branches: [ research-post-mapper-runtime ]
    paths:
      - '.github/workflows/xgo-native-cps1-link.yml'
      - 'tools/multicore/native_cps1/**'
      - 'tools/multicore/native_nes/**'
      - 'tools/multicore/xgo_minimal_environment_shim.c'
      - 'tools/multicore/xgo_preloaded_rom_sbrk.c'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld llvm perl

      - name: Install exact HC15xx Codescape toolchain
        run: |
          set -euxo pipefail
          url='https://cloud.maschath.de/s/dDrZN4DSgJ33E3w/download/Codescape.GNU.Tools.Package.2019.09-03-2.for.MIPS32.MTI.Bare.Metal.Ubuntu-18.04.5.x86_64.tar.gz'
          curl -fL --retry 3 --retry-delay 2 "$url" -o /tmp/codescape-mips32.tar.gz
          sudo tar -xzf /tmp/codescape-mips32.tar.gz -C /opt

      - name: Fetch pinned FB Alpha 2012 CPS1
        run: |
          set -euxo pipefail
          git clone --recursive https://github.com/madcock/fbalpha2012_cps1.git /tmp/cps1
          cd /tmp/cps1
          git checkout 5714c8dc311f4dda6e54533bc8dd901a29700635
          git submodule update --init --recursive
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/core-commit.txt"

      - name: Generate and build SF2000 CPS1 archive
        run: |
          set -euxo pipefail
          cd /tmp/cps1
          mkdir -p src/dep/generated
          perl src/dep/scripts/gamelist.pl -o src/dep/generated/driverlist.h -l gamelist.txt src/burn/drv/capcom
          gcc -D__LIBRETRO_OPTIMIZATIONS__ -o m68kmake src/cpu/m68k/m68kmake.c
          ./m68kmake src/cpu/m68k/ src/cpu/m68k/m68k_in.c
          make -j2 platform=sf2000
          cp fbalpha2012_cps1_libretro_sf2000.a "$GITHUB_WORKSPACE/fbalpha2012_cps1.a"

      - name: Record source contract
        run: |
          set -euxo pipefail
          cd /tmp/cps1
          {
            grep -n -A12 -B6 'AUDIO_SAMPLERATE' src/burner/libretro/libretro.cpp | head -n 80
            grep -n -A10 -B4 'retro_get_system_info' src/burner/libretro/libretro.cpp | head -n 80
            grep -n 'RETRO_ENVIRONMENT_' src/burner/libretro/libretro.cpp | sort -u | head -n 240
            grep -n -A12 -B8 'SET_PIXEL_FORMAT' src/burner/libretro/libretro.cpp | head -n 120
            grep -n -A35 -B8 'bool retro_load_game' src/burner/libretro/libretro.cpp | head -n 120
          } | tee "$GITHUB_WORKSPACE/source-contract.txt"

      - name: Compile shared XGO runtime
        run: |
          set -euxo pipefail
          cc=/opt/mips32-mti-elf/2019.09-03-2/bin/mips-mti-elf-gcc
          flags='-EL -march=mips32 -mtune=mips32 -msoft-float -G0 -mno-abicalls -fno-pic -ffunction-sections -fdata-sections -fno-stack-protector -O2 -DXGO_WITH_NEWLIB -Itools/multicore/include -I/tmp/cps1/src/burner/libretro/libretro-common/include'
          "$cc" $flags -c tools/multicore/native_nes/xgo_core_entry.s -o core_entry.o
          "$cc" $flags -c tools/multicore/native_nes/xgo_gp_bridges.s -o gp_bridges.o
          "$cc" $flags -c tools/multicore/native_cps1/xgo_cps1_native_frontend.c -o frontend.o
          "$cc" $flags -c tools/multicore/native_cps1/xgo_cps1_environment.c -o cps1_environment.o
          "$cc" $flags -c tools/multicore/native_nes/xgo_libretro_state.c -o state.o
          "$cc" $flags -c tools/multicore/xgo_minimal_environment_shim.c -o environment.o
          "$cc" $flags -c tools/multicore/xgo_preloaded_rom_sbrk.c -o sbrk.o
          "$cc" $flags -include tools/multicore/native_nes/xgo_stock_gp_redirects.h             -c tools/multicore/native_nes/xgo_newlib_syscalls.c -o syscalls.o

      - name: Link CPS1 candidate
        run: |
          set -euxo pipefail
          tools=/opt/mips32-mti-elf/2019.09-03-2/bin
          cxx="$tools/mips-mti-elf-g++"
          nm="$tools/mips-mti-elf-nm"
          objcopy="$tools/mips-mti-elf-objcopy"
          objdump="$tools/mips-mti-elf-objdump"

          "$cxx" -EL -march=mips32 -msoft-float -G0 -mno-abicalls -fno-pic             -static -nostartfiles             -Wl,--gc-sections             -Wl,-Map,xgo-cps1.map             -Wl,-T,tools/multicore/native_nes/xgo_core.ld             -Wl,-T,tools/multicore/native_nes/xgo_external_stock_services.ld             core_entry.o gp_bridges.o frontend.o cps1_environment.o state.o environment.o sbrk.o syscalls.o             -Wl,--start-group               fbalpha2012_cps1.a -lstdc++ -lc -lm -lgcc             -Wl,--end-group             -o xgo-cps1.elf

          "$nm" -u xgo-cps1.elf | tee undefined.txt
          test ! -s undefined.txt
          "$nm" -n xgo-cps1.elf > symbols.txt
          "$objdump" -d xgo-cps1.elf > disasm.txt
          "$objcopy" -O binary xgo-cps1.elf xgo-cps1.bin

          symbol_hex() {
            local name="$1"
            awk -v name="$name" '$3 == name {h=$1; if (length(h)>8) h=substr(h,length(h)-7); printf "0x%s\n",h; exit}' symbols.txt
          }
          start=$(symbol_hex __image_start)
          entry=$(symbol_hex __core_entry__)
          file_end=$(symbol_hex __file_end)
          image_end=$(symbol_hex __image_end)
          test "$start" = '0x87000000'
          test "$entry" = '0x87000000'

          payload_size=$(stat -c %s xgo-cps1.bin)
          memory_size=$((image_end - start))
          reserved_size=$((0x87cdae00 - 0x87000000))
          headroom=$((reserved_size - memory_size))
          (( payload_size <= file_end - start ))
          (( memory_size >= payload_size ))
          (( memory_size <= reserved_size ))

          python3 tools/multicore/probe/pack_xgoc.py             xgo-cps1.bin core-fbalpha2012-cps1.xgc             --entry-offset 0             --memory-size "$memory_size" | tee pack.txt
          python3 tools/multicore/probe/inspect_xgoc.py core-fbalpha2012-cps1.xgc | tee inspect.txt

          {
            echo "core_commit=5714c8dc311f4dda6e54533bc8dd901a29700635"
            echo "system_family=0x40"
            echo "audio_rate=11025"
            echo "payload_size=$payload_size"
            echo "memory_size=$memory_size"
            echo "reserved_size=$reserved_size"
            echo "headroom=$headroom"
          } | tee candidate-summary.txt
          sha256sum xgo-cps1.elf xgo-cps1.bin core-fbalpha2012-cps1.xgc | tee output.sha256

      - name: Preserve audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: xgo-native-cps1-core3-audit
          path: |
            core-commit.txt
            source-contract.txt
            fbalpha2012_cps1.a
            xgo-cps1.elf
            xgo-cps1.bin
            core-fbalpha2012-cps1.xgc
            xgo-cps1.map
            symbols.txt
            disasm.txt
            undefined.txt
            pack.txt
            inspect.txt
            candidate-summary.txt
            output.sha256
          retention-days: 30
