name: FCEUmm MIPS symbol audit

on:
  workflow_dispatch:
  push:
    branches:
      - research-external-core-integration
    paths:
      - .github/workflows/fceumm-symbol-audit.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Install MIPS cross tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-mipsel-linux-gnu g++-mipsel-linux-gnu \
            binutils-mipsel-linux-gnu make git

          # Compile-only archive audit: Ubuntu's Linux MIPS sysroot omits the
          # soft-float glibc selector header. The final XGO core will not link
          # Linux glibc; this only permits the source to be compiled with the
          # same -msoft-float ABI used by the HC15xx target.
          sudo touch /usr/mipsel-linux-gnu/include/gnu/stubs-o32_soft.h

      - name: Fetch pinned HC15xx FCEUmm
        run: |
          git clone --no-checkout https://github.com/madcock/libretro-fceumm.git fceumm
          cd fceumm
          git checkout e6111e684e7a7761f3f1d6c80d0a825e2c8cdc7e

      - name: Build SF2000 static archive with compatible MIPS compiler
        working-directory: fceumm
        run: |
          make clean || true
          make -j2 platform=sf2000 \
            CC=mipsel-linux-gnu-gcc \
            CXX=mipsel-linux-gnu-g++ \
            AR=mipsel-linux-gnu-ar

      - name: Compute true archive-wide unresolved symbols
        working-directory: fceumm
        run: |
          set -euo pipefail
          archive=fceumm_libretro_sf2000.a
          test -f "$archive"

          # nm -A gives one line per symbol with an archive/member prefix. Keep
          # only the symbol field. A static archive may reference symbols that
          # another member of the same archive defines, so subtract the archive's
          # complete defined-global set from the complete undefined-reference set.
          mipsel-linux-gnu-nm -A -g --defined-only "$archive" \
            | awk '{print $NF}' | sort -u > ../defined.txt
          mipsel-linux-gnu-nm -A -u "$archive" \
            | awk '{print $NF}' | sort -u > ../referenced-undefined.txt
          comm -23 ../referenced-undefined.txt ../defined.txt > ../external-unresolved.txt

          # Broad classification is informational; external-unresolved.txt is
          # the authoritative set. Keep categories deliberately simple so odd
          # dependencies remain visible instead of being hidden by heuristics.
          grep -E '^(__add|__sub|__mul|__div|__udiv|__fix|__float|__extend|__trunc|__eq|__ne|__lt|__le|__gt|__ge)' \
            ../external-unresolved.txt > ../compiler-runtime.txt || true
          grep -E '^(atan|atan2|cos|cosf|exp|exp2|expf|log|log10|pow|sin|sinf|sincos|sincosf|sqrt|sqrtf)$' \
            ../external-unresolved.txt > ../libm.txt || true
          grep -E '^(crc32|gz|inflate|deflate|zlib)' \
            ../external-unresolved.txt > ../zlib.txt || true

          {
            echo '# FCEUmm pinned HC15xx archive audit'
            echo
            echo 'commit: e6111e684e7a7761f3f1d6c80d0a825e2c8cdc7e'
            echo "archive: $archive"
            echo
            echo '## archive size'
            stat -c '%s bytes' "$archive"
            echo
            echo '## ELF architecture samples'
            first=$(mipsel-linux-gnu-ar t "$archive" | head -n 5)
            for obj in $first; do
              mipsel-linux-gnu-ar p "$archive" "$obj" > "/tmp/$obj"
              file "/tmp/$obj"
              mipsel-linux-gnu-readelf -h "/tmp/$obj" | grep -E 'Class:|Data:|Machine:|Flags:' || true
            done
            echo
            echo '## archive-wide counts'
            printf 'defined globals:      '; wc -l < ../defined.txt
            printf 'undefined references: '; wc -l < ../referenced-undefined.txt
            printf 'true external set:    '; wc -l < ../external-unresolved.txt
            echo
            echo '## true external unresolved symbols'
            cat ../external-unresolved.txt
            echo
            echo '## likely compiler-runtime symbols'
            cat ../compiler-runtime.txt || true
            echo
            echo '## likely libm symbols'
            cat ../libm.txt || true
            echo
            echo '## likely zlib symbols'
            cat ../zlib.txt || true
          } | tee ../fceumm-symbol-audit.txt

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: fceumm-symbol-audit
          path: |
            fceumm-symbol-audit.txt
            external-unresolved.txt
            compiler-runtime.txt
            libm.txt
            zlib.txt
