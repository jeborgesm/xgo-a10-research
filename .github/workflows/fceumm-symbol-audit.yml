name: FCEUmm MIPS symbol audit

on:
  workflow_dispatch:
  push:
    branches:
      - research-external-core-integration
    paths:
      - .github/workflows/fceumm-symbol-audit.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Install MIPS cross tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-mipsel-linux-gnu g++-mipsel-linux-gnu \
            binutils-mipsel-linux-gnu make git
          sudo touch /usr/mipsel-linux-gnu/include/gnu/stubs-o32_soft.h

      - name: Fetch pinned HC15xx sources
        run: |
          git clone --no-checkout https://github.com/madcock/libretro-fceumm.git fceumm
          (cd fceumm && git checkout e6111e684e7a7761f3f1d6c80d0a825e2c8cdc7e)
          git clone --no-checkout https://github.com/madcock/libretro-common.git libretro-common
          (cd libretro-common && git checkout 9362316bf1da38160b324a1515bfb83e44ebd7af)

      - name: Build pinned FCEUmm archive
        working-directory: fceumm
        run: |
          make clean || true
          make -j2 platform=sf2000 \
            'CC=mipsel-linux-gnu-gcc -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -fno-stack-protector' \
            'CXX=mipsel-linux-gnu-g++ -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -fno-stack-protector' \
            AR=mipsel-linux-gnu-ar

      - name: Build pinned Multicore libretro-common archive
        working-directory: libretro-common
        run: |
          make clean || true
          make -j2 \
            'CC=mipsel-linux-gnu-gcc -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -fno-stack-protector' \
            AR=mipsel-linux-gnu-ar

      - name: Compute combined external runtime surface
        run: |
          set -euo pipefail
          core=fceumm/fceumm_libretro_sf2000.a
          common=libretro-common/libretro-common.a
          test -f "$core" && test -f "$common"

          : > defined.txt
          : > referenced-undefined.txt
          for archive in "$core" "$common"; do
            mipsel-linux-gnu-nm -A -g --defined-only "$archive" | awk '{print $NF}' >> defined.txt
            mipsel-linux-gnu-nm -A -u "$archive" | awk '{print $NF}' >> referenced-undefined.txt
          done
          sort -u -o defined.txt defined.txt
          sort -u -o referenced-undefined.txt referenced-undefined.txt
          comm -23 referenced-undefined.txt defined.txt > external-unresolved.txt

          grep -E '^(__add|__sub|__mul|__div|__udiv|__fix|__float|__extend|__trunc|__eq|__ne|__lt|__le|__gt|__ge)' \
            external-unresolved.txt > compiler-runtime.txt || true
          grep -E '^(atan|atan2|cos|cosf|exp|exp2|expf|log|log10|pow|sin|sinf|sincos|sincosf|sqrt|sqrtf|floor|floorf|ceil|ceilf)$' \
            external-unresolved.txt > libm.txt || true
          grep -E '^(adler32|crc32|gz|inflate|deflate|zlib)' external-unresolved.txt > zlib.txt || true

          {
            echo '# XGO pinned FCEUmm + libretro-common runtime audit'
            echo
            echo 'FCEUmm: e6111e684e7a7761f3f1d6c80d0a825e2c8cdc7e'
            echo 'libretro-common: 9362316bf1da38160b324a1515bfb83e44ebd7af'
            echo
            printf 'FCEUmm archive:         '; stat -c '%s bytes' "$core"
            printf 'libretro-common archive:'; stat -c ' %s bytes' "$common"
            echo
            echo '## combined counts'
            printf 'defined globals:      '; wc -l < defined.txt
            printf 'undefined references: '; wc -l < referenced-undefined.txt
            printf 'true external set:    '; wc -l < external-unresolved.txt
            echo
            echo '## true external unresolved symbols'
            cat external-unresolved.txt
            echo
            echo '## likely compiler runtime'
            cat compiler-runtime.txt || true
            echo
            echo '## likely libm'
            cat libm.txt || true
            echo
            echo '## likely zlib still external'
            cat zlib.txt || true
          } | tee fceumm-symbol-audit.txt

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: fceumm-symbol-audit
          path: |
            fceumm-symbol-audit.txt
            external-unresolved.txt
            compiler-runtime.txt
            libm.txt
            zlib.txt
