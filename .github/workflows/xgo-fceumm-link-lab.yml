name: XGO FCEUmm link lab

on:
  workflow_dispatch:
  push:
    branches:
      - research-external-core-integration
    paths:
      - '.github/workflows/xgo-fceumm-link-lab.yml'
      - 'tools/multicore/**'
      - 'findings/xgoc-self-describing-external-core-format.md'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/xgo-fceumm-link-lab.yml'
      - 'tools/multicore/**'
      - 'findings/xgoc-self-describing-external-core-format.md'

jobs:
  build-fceumm-archive:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout XGO research branch
        uses: actions/checkout@v4

      - name: Install exact HC15xx Codescape toolchain
        shell: bash
        run: |
          set -euxo pipefail
          url='https://cloud.maschath.de/s/dDrZN4DSgJ33E3w/download/Codescape.GNU.Tools.Package.2019.09-03-2.for.MIPS32.MTI.Bare.Metal.Ubuntu-18.04.5.x86_64.tar.gz'
          curl -fL --retry 3 --retry-delay 2 "$url" -o /tmp/codescape-mips32.tar.gz
          sha256sum /tmp/codescape-mips32.tar.gz | tee toolchain.sha256
          sudo tar -xzf /tmp/codescape-mips32.tar.gz -C /opt
          /opt/mips32-mti-elf/2019.09-03-2/bin/mips-mti-elf-gcc --version | tee toolchain-version.txt

      - name: Fetch pinned HC15xx FCEUmm source
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/madcock/libretro-fceumm.git upstream-fceumm
          cd upstream-fceumm
          git checkout e6111e684e7a7761f3f1d6c80d0a825e2c8cdc7e
          test "$(git rev-parse HEAD)" = 'e6111e684e7a7761f3f1d6c80d0a825e2c8cdc7e'

      - name: Build FCEUmm plus XGO support slice
        shell: bash
        run: |
          set -euxo pipefail
          tools=/opt/mips32-mti-elf/2019.09-03-2/bin
          cc="$tools/mips-mti-elf-gcc"
          ar="$tools/mips-mti-elf-ar"
          flags='-EL -march=mips32 -mtune=mips32 -msoft-float -G0 -mno-abicalls -fno-pic -ffast-math -fomit-frame-pointer -ffunction-sections -fdata-sections -O2 -DNDEBUG -DSF2000'

          make -C upstream-fceumm platform=sf2000 -j2
          cp upstream-fceumm/fceumm_libretro_sf2000.a .

          $cc $flags -c tools/multicore/xgo_fceumm_support.c -o xgo_fceumm_support.o
          $cc $flags -c tools/multicore/xgo_newlib_stubs.c -o xgo_newlib_stubs.o
          "$ar" rcs xgo_fceumm_support.a xgo_fceumm_support.o xgo_newlib_stubs.o

          # Executable-side XGO bridge. These objects are linked directly so
          # __start and the compatibility environment cannot be archive-GC'd.
          $cc $flags -c tools/multicore/xgo_fceumm_entry.c -o xgo_fceumm_entry.o
          $cc $flags -c tools/multicore/xgo_minimal_environment_shim.c -o xgo_minimal_environment_shim.o

          ls -lh fceumm_libretro_sf2000.a xgo_fceumm_support.a \
                 xgo_fceumm_entry.o xgo_minimal_environment_shim.o
          sha256sum fceumm_libretro_sf2000.a | tee fceumm-archive.sha256
          sha256sum xgo_fceumm_support.a | tee xgo-support-archive.sha256

      - name: Analyze true external symbols
        shell: bash
        run: |
          set -euxo pipefail
          nm=/opt/mips32-mti-elf/2019.09-03-2/bin/mips-mti-elf-nm

          python3 tools/multicore/analyze_archive_symbols.py \
            --nm "$nm" \
            --output fceumm-external-symbols.txt \
            --classified-output fceumm-external-symbols-classified.txt \
            fceumm_libretro_sf2000.a \
            | tee fceumm-symbol-analysis.txt

          python3 tools/multicore/analyze_archive_symbols.py \
            --nm "$nm" \
            --output fceumm-plus-xgo-support-external-symbols.txt \
            --classified-output fceumm-plus-xgo-support-external-symbols-classified.txt \
            fceumm_libretro_sf2000.a xgo_fceumm_support.a \
            | tee fceumm-plus-xgo-support-symbol-analysis.txt

      - name: Resolve against XGO firmware symbols and Codescape runtime
        shell: bash
        run: |
          set -euxo pipefail
          cc=/opt/mips32-mti-elf/2019.09-03-2/bin/mips-mti-elf-gcc
          nm=/opt/mips32-mti-elf/2019.09-03-2/bin/mips-mti-elf-nm

          "$cc" -EL -march=mips32 -msoft-float -G0 -mno-abicalls -fno-pic \
            -r -nostartfiles \
            -Wl,-T,tools/multicore/xgo_stockfw_symbols.ld \
            -Wl,--whole-archive fceumm_libretro_sf2000.a xgo_fceumm_support.a \
            -Wl,--no-whole-archive \
            -Wl,--start-group -lc -lm -lgcc -Wl,--end-group \
            -o fceumm-runtime-resolved.o \
            2>&1 | tee fceumm-runtime-link.log

          "$nm" -u fceumm-runtime-resolved.o \
            | awk '$1 == "U" {print $2}' | sort -u \
            | tee fceumm-after-runtime-symbols.txt
          "$nm" -n fceumm-runtime-resolved.o > fceumm-runtime-resolved.nm

          unresolved=$(wc -l < fceumm-after-runtime-symbols.txt)
          echo "$unresolved" | tee fceumm-after-runtime-count.txt
          if (( unresolved != 0 )); then
            echo "ERROR: final partial link still has $unresolved unresolved symbols" >&2
            exit 1
          fi

      - name: Fully link XGO FCEUmm at 0x87000000
        shell: bash
        run: |
          set -euxo pipefail
          tools=/opt/mips32-mti-elf/2019.09-03-2/bin
          cc="$tools/mips-mti-elf-gcc"
          nm="$tools/mips-mti-elf-nm"
          objcopy="$tools/mips-mti-elf-objcopy"
          readelf="$tools/mips-mti-elf-readelf"

          "$cc" -EL -march=mips32 -msoft-float -G0 -mno-abicalls -fno-pic \
            -static -nostartfiles \
            -Wl,--gc-sections \
            -Wl,-Map,xgo-fceumm.map \
            -Wl,-T,tools/multicore/xgo_external_core.ld \
            -Wl,-T,tools/multicore/xgo_stockfw_symbols.ld \
            xgo_fceumm_entry.o xgo_minimal_environment_shim.o \
            -Wl,--start-group \
              fceumm_libretro_sf2000.a xgo_fceumm_support.a \
              -lc -lm -lgcc \
            -Wl,--end-group \
            -o xgo-fceumm.elf \
            2>&1 | tee xgo-fceumm-link.log

          "$nm" -u xgo-fceumm.elf | tee xgo-fceumm-undefined.txt
          unresolved=$(awk '$1 == "U" {n++} END {print n+0}' xgo-fceumm-undefined.txt)
          if (( unresolved != 0 )); then
            echo "ERROR: fully linked XGO FCEUmm still has $unresolved undefined symbols" >&2
            exit 1
          fi

          "$nm" -n xgo-fceumm.elf > xgo-fceumm.nm
          "$readelf" -h -S -l xgo-fceumm.elf > xgo-fceumm.readelf.txt
          "$objcopy" -O binary xgo-fceumm.elf xgo-fceumm.bin

          # Codescape nm sign-extends 32-bit MIPS addresses in this ELF, e.g.
          # 87000000 appears as ffffffff87000000. Normalize every symbol to the
          # low 32 bits before Bash arithmetic so host shell signedness cannot
          # make a valid target address fail the CI layout checks.
          symbol_hex() {
            local name="$1"
            awk -v name="$name" '
              $3 == name {
                h=$1
                if (length(h) > 8) h=substr(h, length(h)-7)
                printf "0x%s\n", h
                exit
              }' xgo-fceumm.nm
          }

          start=$(symbol_hex __image_start)
          entry=$(symbol_hex __start)
          file_end=$(symbol_hex __file_end)
          bss_start=$(symbol_hex __bss_start)
          image_end=$(symbol_hex __image_end)

          test "$start" = '0x87000000'
          test -n "$entry"
          test -n "$file_end"
          test -n "$bss_start"
          test -n "$image_end"

          entry_offset=$((entry - start))
          linked_file_span=$((file_end - start))
          memory_size=$((image_end - start))
          payload_size=$(stat -c %s xgo-fceumm.bin)
          reserved_size=$((0x87cdae00 - 0x87000000))

          {
            printf 'image_start=0x%08x\n' "$((start))"
            printf 'entry=0x%08x\n' "$((entry))"
            printf 'entry_offset=0x%x\n' "$entry_offset"
            printf 'file_end=0x%08x\n' "$((file_end))"
            printf 'linked_file_span=%d\n' "$linked_file_span"
            printf 'payload_size=%d\n' "$payload_size"
            printf 'bss_start=0x%08x\n' "$((bss_start))"
            printf 'image_end=0x%08x\n' "$((image_end))"
            printf 'memory_size=%d\n' "$memory_size"
            printf 'reserved_size=%d\n' "$reserved_size"
            printf 'headroom=%d\n' "$((reserved_size - memory_size))"
          } | tee xgo-fceumm-layout.txt

          if (( entry_offset < 0 || entry_offset >= payload_size )); then
            echo 'ERROR: __start does not point inside file-backed payload' >&2
            exit 1
          fi
          if (( payload_size > linked_file_span )); then
            echo 'ERROR: objcopy payload extends beyond linker __file_end' >&2
            exit 1
          fi
          if (( memory_size < payload_size || memory_size > reserved_size )); then
            echo 'ERROR: runtime image does not fit XGO reserved core window' >&2
            exit 1
          fi

          python3 tools/multicore/probe/pack_xgoc.py \
            xgo-fceumm.bin core.xgc \
            --entry-offset "$entry_offset" \
            --memory-size "$memory_size" \
            | tee xgo-fceumm-pack.txt

          python3 tools/multicore/probe/inspect_xgoc.py core.xgc \
            | tee xgo-fceumm-xgoc-inspection.txt

          sha256sum xgo-fceumm.elf xgo-fceumm.bin core.xgc \
            | tee xgo-fceumm-output.sha256

      - name: Upload link-lab artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xgo-fceumm-link-lab
          if-no-files-found: warn
          path: |
            fceumm_libretro_sf2000.a
            xgo_fceumm_support.a
            fceumm-archive.sha256
            xgo-support-archive.sha256
            fceumm-external-symbols.txt
            fceumm-external-symbols-classified.txt
            fceumm-symbol-analysis.txt
            fceumm-plus-xgo-support-external-symbols.txt
            fceumm-plus-xgo-support-external-symbols-classified.txt
            fceumm-plus-xgo-support-symbol-analysis.txt
            fceumm-after-runtime-symbols.txt
            fceumm-after-runtime-count.txt
            fceumm-runtime-link.log
            fceumm-runtime-resolved.o
            fceumm-runtime-resolved.nm
            xgo-fceumm-link.log
            xgo-fceumm.elf
            xgo-fceumm.bin
            xgo-fceumm.map
            xgo-fceumm.nm
            xgo-fceumm.readelf.txt
            xgo-fceumm-undefined.txt
            xgo-fceumm-layout.txt
            xgo-fceumm-pack.txt
            xgo-fceumm-xgoc-inspection.txt
            xgo-fceumm-output.sha256
            core.xgc
            toolchain.sha256
            toolchain-version.txt
