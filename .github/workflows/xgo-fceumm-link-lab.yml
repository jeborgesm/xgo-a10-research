name: XGO FCEUmm link lab

on:
  workflow_dispatch:
  push:
    branches:
      - research-external-core-integration
    paths:
      - '.github/workflows/xgo-fceumm-link-lab.yml'
      - 'tools/multicore/**'
      - 'findings/xgoc-self-describing-external-core-format.md'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/xgo-fceumm-link-lab.yml'
      - 'tools/multicore/**'
      - 'findings/xgoc-self-describing-external-core-format.md'

jobs:
  build-fceumm-archive:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout XGO research branch
        uses: actions/checkout@v4

      - name: Install exact HC15xx Codescape toolchain
        shell: bash
        run: |
          set -euxo pipefail
          url='https://cloud.maschath.de/s/dDrZN4DSgJ33E3w/download/Codescape.GNU.Tools.Package.2019.09-03-2.for.MIPS32.MTI.Bare.Metal.Ubuntu-18.04.5.x86_64.tar.gz'
          curl -fL --retry 3 --retry-delay 2 "$url" -o /tmp/codescape-mips32.tar.gz
          sha256sum /tmp/codescape-mips32.tar.gz | tee toolchain.sha256
          sudo tar -xzf /tmp/codescape-mips32.tar.gz -C /opt
          /opt/mips32-mti-elf/2019.09-03-2/bin/mips-mti-elf-gcc --version | tee toolchain-version.txt

      - name: Fetch pinned HC15xx sources
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/madcock/libretro-fceumm.git upstream-fceumm
          cd upstream-fceumm
          git checkout e6111e684e7a7761f3f1d6c80d0a825e2c8cdc7e
          test "$(git rev-parse HEAD)" = 'e6111e684e7a7761f3f1d6c80d0a825e2c8cdc7e'
          cd ..
          git clone https://github.com/madcock/libretro-common.git upstream-libretro-common

      - name: Build exact SF2000 static archives
        shell: bash
        run: |
          set -euxo pipefail
          make -C upstream-fceumm platform=sf2000 -j2
          test -f upstream-fceumm/fceumm_libretro_sf2000.a
          cp upstream-fceumm/fceumm_libretro_sf2000.a .

          make -C upstream-libretro-common -j2
          test -f upstream-libretro-common/libretro-common.a
          cp upstream-libretro-common/libretro-common.a .

          ls -lh fceumm_libretro_sf2000.a libretro-common.a
          sha256sum fceumm_libretro_sf2000.a | tee fceumm-archive.sha256
          sha256sum libretro-common.a | tee libretro-common-archive.sha256

      - name: Analyze true external symbols
        shell: bash
        run: |
          set -euxo pipefail
          nm=/opt/mips32-mti-elf/2019.09-03-2/bin/mips-mti-elf-nm

          python3 tools/multicore/analyze_archive_symbols.py \
            --nm "$nm" \
            --output fceumm-external-symbols.txt \
            --classified-output fceumm-external-symbols-classified.txt \
            fceumm_libretro_sf2000.a \
            | tee fceumm-symbol-analysis.txt

          python3 tools/multicore/analyze_archive_symbols.py \
            --nm "$nm" \
            --output fceumm-plus-common-external-symbols.txt \
            --classified-output fceumm-plus-common-external-symbols-classified.txt \
            fceumm_libretro_sf2000.a libretro-common.a \
            | tee fceumm-plus-common-symbol-analysis.txt

          /opt/mips32-mti-elf/2019.09-03-2/bin/mips-mti-elf-ar t \
            fceumm_libretro_sf2000.a | tee fceumm-archive-members.txt

      - name: Resolve archives against Codescape runtime libraries
        shell: bash
        continue-on-error: true
        run: |
          set -euxo pipefail
          cc=/opt/mips32-mti-elf/2019.09-03-2/bin/mips-mti-elf-gcc
          nm=/opt/mips32-mti-elf/2019.09-03-2/bin/mips-mti-elf-nm

          "$cc" -EL -march=mips32 -msoft-float -G0 -mno-abicalls -fno-pic \
            -r -nostartfiles \
            -Wl,--whole-archive fceumm_libretro_sf2000.a libretro-common.a \
            -Wl,--no-whole-archive \
            -Wl,--start-group -lc -lm -lgcc -Wl,--end-group \
            -o fceumm-runtime-resolved.o \
            2>&1 | tee fceumm-runtime-link.log

          if [[ -f fceumm-runtime-resolved.o ]]; then
            "$nm" -u fceumm-runtime-resolved.o \
              | awk '$1 == "U" {print $2}' | sort -u \
              | tee fceumm-after-runtime-symbols.txt
          fi

      - name: Show XGOC probe build environment
        shell: bash
        continue-on-error: true
        run: |
          set -x
          which clang || true
          which ld.lld || true
          which llvm-objcopy || true
          which nm || true
          which python3 || true
          clang --version || true
          ld.lld --version || true
          llvm-objcopy --version || true
          nm --version || true

      - name: Build XGOC probe tooling
        shell: bash
        continue-on-error: true
        run: |
          set -euxo pipefail
          cd tools/multicore/probe
          bash ./build_probe.sh 2>&1 | tee ../../../xgoc-build.log
          if [[ -f core.xgc ]]; then
            python3 inspect_xgoc.py core.xgc 2>&1 | tee ../../../xgoc-inspect.log
          fi

      - name: Upload link-lab artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xgo-fceumm-link-lab
          if-no-files-found: warn
          path: |
            fceumm_libretro_sf2000.a
            libretro-common.a
            fceumm-archive.sha256
            libretro-common-archive.sha256
            fceumm-external-symbols.txt
            fceumm-external-symbols-classified.txt
            fceumm-symbol-analysis.txt
            fceumm-plus-common-external-symbols.txt
            fceumm-plus-common-external-symbols-classified.txt
            fceumm-plus-common-symbol-analysis.txt
            fceumm-after-runtime-symbols.txt
            fceumm-runtime-link.log
            fceumm-runtime-resolved.o
            fceumm-archive-members.txt
            toolchain.sha256
            toolchain-version.txt
            xgoc-build.log
            xgoc-inspect.log
            tools/multicore/probe/core.xgc
            tools/multicore/probe/xgo_probe_loader.bin
