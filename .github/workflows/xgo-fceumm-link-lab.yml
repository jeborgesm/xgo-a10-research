name: XGO FCEUmm link lab

# Historical dependency-closure lab for the first semicolon/GBA-style FCEUmm
# experiment. This workflow deliberately no longer emits a device-test ELF or
# XGOC. The later bidirectional-$gp finding proved that the legacy frontend's
# direct calls between external code and stock firmware were not hardware-safe.
#
# Authoritative executable gate:
#   .github/workflows/xgo-native-fceumm-full-link.yml
# Authoritative ABI finding:
#   findings/xgo-bidirectional-gp-abi.md

on:
  workflow_dispatch:
  push:
    branches:
      - research-external-core-integration
    paths:
      - '.github/workflows/xgo-fceumm-link-lab.yml'
      - 'tools/multicore/xgo_fceumm_support.c'
      - 'tools/multicore/xgo_newlib_stubs.c'
      - 'tools/multicore/analyze_archive_symbols.py'
      - 'tools/multicore/xgo_stockfw_symbols.ld'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/xgo-fceumm-link-lab.yml'
      - 'tools/multicore/xgo_fceumm_support.c'
      - 'tools/multicore/xgo_newlib_stubs.c'
      - 'tools/multicore/analyze_archive_symbols.py'
      - 'tools/multicore/xgo_stockfw_symbols.ld'

jobs:
  build-fceumm-archive:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout XGO research branch
        uses: actions/checkout@v4

      - name: Install exact HC15xx Codescape toolchain
        shell: bash
        run: |
          set -euxo pipefail
          url='https://cloud.maschath.de/s/dDrZN4DSgJ33E3w/download/Codescape.GNU.Tools.Package.2019.09-03-2.for.MIPS32.MTI.Bare.Metal.Ubuntu-18.04.5.x86_64.tar.gz'
          curl -fL --retry 3 --retry-delay 2 "$url" -o /tmp/codescape-mips32.tar.gz
          sha256sum /tmp/codescape-mips32.tar.gz | tee toolchain.sha256
          sudo tar -xzf /tmp/codescape-mips32.tar.gz -C /opt
          /opt/mips32-mti-elf/2019.09-03-2/bin/mips-mti-elf-gcc --version | tee toolchain-version.txt

      - name: Fetch pinned HC15xx FCEUmm source
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/madcock/libretro-fceumm.git upstream-fceumm
          cd upstream-fceumm
          git checkout e6111e684e7a7761f3f1d6c80d0a825e2c8cdc7e
          test "$(git rev-parse HEAD)" = 'e6111e684e7a7761f3f1d6c80d0a825e2c8cdc7e'

      - name: Build FCEUmm plus historical XGO support slice
        shell: bash
        run: |
          set -euxo pipefail
          tools=/opt/mips32-mti-elf/2019.09-03-2/bin
          cc="$tools/mips-mti-elf-gcc"
          ar="$tools/mips-mti-elf-ar"
          flags='-EL -march=mips32 -mtune=mips32 -msoft-float -G0 -mno-abicalls -fno-pic -ffast-math -fomit-frame-pointer -ffunction-sections -fdata-sections -O2 -DNDEBUG -DSF2000'

          make -C upstream-fceumm platform=sf2000 -j2
          cp upstream-fceumm/fceumm_libretro_sf2000.a .

          $cc $flags -c tools/multicore/xgo_fceumm_support.c -o xgo_fceumm_support.o
          $cc $flags -c tools/multicore/xgo_newlib_stubs.c -o xgo_newlib_stubs.o
          "$ar" rcs xgo_fceumm_support.a xgo_fceumm_support.o xgo_newlib_stubs.o

          ls -lh fceumm_libretro_sf2000.a xgo_fceumm_support.a
          sha256sum fceumm_libretro_sf2000.a | tee fceumm-archive.sha256
          sha256sum xgo_fceumm_support.a | tee xgo-support-archive.sha256

      - name: Analyze true external symbols
        shell: bash
        run: |
          set -euxo pipefail
          nm=/opt/mips32-mti-elf/2019.09-03-2/bin/mips-mti-elf-nm

          python3 tools/multicore/analyze_archive_symbols.py \
            --nm "$nm" \
            --output fceumm-external-symbols.txt \
            --classified-output fceumm-external-symbols-classified.txt \
            fceumm_libretro_sf2000.a \
            | tee fceumm-symbol-analysis.txt

          python3 tools/multicore/analyze_archive_symbols.py \
            --nm "$nm" \
            --output fceumm-plus-xgo-support-external-symbols.txt \
            --classified-output fceumm-plus-xgo-support-external-symbols-classified.txt \
            fceumm_libretro_sf2000.a xgo_fceumm_support.a \
            | tee fceumm-plus-xgo-support-symbol-analysis.txt

      - name: Resolve historical archive surface against XGO and Codescape runtime
        shell: bash
        run: |
          set -euxo pipefail
          cc=/opt/mips32-mti-elf/2019.09-03-2/bin/mips-mti-elf-gcc
          nm=/opt/mips32-mti-elf/2019.09-03-2/bin/mips-mti-elf-nm

          "$cc" -EL -march=mips32 -msoft-float -G0 -mno-abicalls -fno-pic \
            -r -nostartfiles \
            -Wl,-T,tools/multicore/xgo_stockfw_symbols.ld \
            -Wl,--whole-archive fceumm_libretro_sf2000.a xgo_fceumm_support.a \
            -Wl,--no-whole-archive \
            -Wl,--start-group -lc -lm -lgcc -Wl,--end-group \
            -o fceumm-runtime-resolved.o \
            2>&1 | tee fceumm-runtime-link.log

          "$nm" -u fceumm-runtime-resolved.o \
            | awk '$1 == "U" {print $2}' | sort -u \
            | tee fceumm-after-runtime-symbols.txt
          "$nm" -n fceumm-runtime-resolved.o > fceumm-runtime-resolved.nm

          unresolved=$(wc -l < fceumm-after-runtime-symbols.txt)
          echo "$unresolved" | tee fceumm-after-runtime-count.txt
          if (( unresolved != 0 )); then
            echo "ERROR: historical archive closure still has $unresolved unresolved symbols" >&2
            exit 1
          fi

      - name: Record executable retirement boundary
        shell: bash
        run: |
          cat > legacy-link-boundary.txt <<'EOF'
          The semicolon/GBA-era FCEUmm experiment remains useful as archive and
          runtime-closure evidence only.

          It MUST NOT be interpreted as a hardware-test executable path.
          Subsequent XGO disassembly proved that stock callbacks/services require
          stock $gp=0x80c34774 while external FCEUmm/newlib requires its own _gp.
          The old direct-call frontend did not bridge that boundary in either
          direction.

          Use XGO native FCEUmm full link and native_nes/xgo_gp_bridges.s for
          executable/device-test work. See findings/xgo-bidirectional-gp-abi.md.
          EOF
          cat legacy-link-boundary.txt

      - name: Upload legacy closure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xgo-fceumm-link-lab
          if-no-files-found: warn
          path: |
            fceumm_libretro_sf2000.a
            xgo_fceumm_support.a
            fceumm-archive.sha256
            xgo-support-archive.sha256
            fceumm-external-symbols.txt
            fceumm-external-symbols-classified.txt
            fceumm-symbol-analysis.txt
            fceumm-plus-xgo-support-external-symbols.txt
            fceumm-plus-xgo-support-external-symbols-classified.txt
            fceumm-plus-xgo-support-symbol-analysis.txt
            fceumm-after-runtime-symbols.txt
            fceumm-after-runtime-count.txt
            fceumm-runtime-link.log
            fceumm-runtime-resolved.o
            fceumm-runtime-resolved.nm
            legacy-link-boundary.txt
            toolchain.sha256
            toolchain-version.txt
