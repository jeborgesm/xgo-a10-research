name: XGO SNES Core #2 audit

on:
  push:
    branches: [ research-post-mapper-runtime ]
    paths:
      - '.github/workflows/xgo-snes-core2-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install exact HC15xx Codescape toolchain
        run: |
          set -euxo pipefail
          url='https://cloud.maschath.de/s/dDrZN4DSgJ33E3w/download/Codescape.GNU.Tools.Package.2019.09-03-2.for.MIPS32.MTI.Bare.Metal.Ubuntu-18.04.5.x86_64.tar.gz'
          curl -fL --retry 3 --retry-delay 2 "$url" -o /tmp/codescape-mips32.tar.gz
          sudo tar -xzf /tmp/codescape-mips32.tar.gz -C /opt
          /opt/mips32-mti-elf/2019.09-03-2/bin/mips-mti-elf-gcc --version | tee toolchain-version.txt

      - name: Fetch pinned SF2000 Snes9x2005 fork
        run: |
          set -euxo pipefail
          git clone --recursive https://github.com/madcock/snes9x2005.git /tmp/snes9x2005
          cd /tmp/snes9x2005
          git checkout fa69dd6a3caf279cc1f457e65e360f8b9a3683ed
          git submodule update --init --recursive
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/core-commit.txt"
          git submodule status --recursive | tee "$GITHUB_WORKSPACE/submodules.txt"

      - name: Record frontend-contract source evidence
        run: |
          set -euxo pipefail
          cd /tmp/snes9x2005
          {
            echo '=== SF2000 Makefile block ==='
            awk '/# SF2000/{flag=1} flag{print} /# MIYOO/{if(flag){exit}}' Makefile
            echo
            echo '=== audio sample-rate definition ==='
            grep -n -A6 -B4 'AUDIO_SAMPLE_RATE' libretro.c
            echo
            echo '=== environment commands ==='
            grep -n 'RETRO_ENVIRONMENT_' libretro.c | head -n 240
            echo
            echo '=== pixel format ==='
            grep -n -A8 -B8 'PIXEL_FORMAT' libretro.c | head -n 120
            echo
            echo '=== serialization exports ==='
            grep -n -E 'retro_serialize(_size)?|retro_unserialize' libretro.c
          } | tee "$GITHUB_WORKSPACE/source-contract.txt"

      - name: Build unmodified SF2000 archive
        run: |
          set -euxo pipefail
          cd /tmp/snes9x2005
          make clean || true
          make -j2 platform=sf2000
          cp snes9x2005_libretro_sf2000.a "$GITHUB_WORKSPACE/snes9x2005-sf2000.a"

      - name: Build XGO memory-load candidate archive
        run: |
          set -euxo pipefail
          cd /tmp/snes9x2005
          make clean || true
          make -j2 platform=sf2000 LOAD_FROM_MEMORY=1
          cp snes9x2005_libretro_sf2000.a "$GITHUB_WORKSPACE/snes9x2005-xgo-memory.a"

      - name: Audit both archives
        run: |
          set -euxo pipefail
          tools=/opt/mips32-mti-elf/2019.09-03-2/bin
          for a in snes9x2005-sf2000.a snes9x2005-xgo-memory.a; do
            base="${a%.a}"
            "$tools/mips-mti-elf-size" -A "$a" > "$base-size.txt"
            "$tools/mips-mti-elf-nm" -u "$a" | sort -u > "$base-undefined.txt"
            "$tools/mips-mti-elf-nm" -g --defined-only "$a" | sort > "$base-defined.txt"
            "$tools/mips-mti-elf-objdump" -h "$a" > "$base-sections.txt"
            {
              echo "archive=$a"
              stat -c 'file_size=%s' "$a"
              echo
              echo 'required libretro exports:'
              for s in retro_init retro_deinit retro_load_game retro_unload_game retro_run retro_get_system_av_info retro_get_region retro_serialize_size retro_serialize retro_unserialize; do
                if grep -Eq "[[:space:]]$s$" "$base-defined.txt"; then echo "PASS $s"; else echo "MISS $s"; fi
              done
              echo
              echo 'selected unresolved/runtime surface:'
              grep -E ' (malloc|calloc|realloc|free|memcpy|memset|fopen|fread|fwrite|fseek|fclose|filestream_|log|sin|cos|pow|sqrt|__.*)$' "$base-undefined.txt" || true
            } > "$base-summary.txt"
          done
          diff -u snes9x2005-sf2000-undefined.txt snes9x2005-xgo-memory-undefined.txt > undefined-diff.txt || true
          sha256sum *.a | tee archive-sha256.txt

      - name: Preserve audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: xgo-snes-core2-audit
          path: |
            toolchain-version.txt
            core-commit.txt
            submodules.txt
            source-contract.txt
            snes9x2005-*.a
            snes9x2005-*-size.txt
            snes9x2005-*-undefined.txt
            snes9x2005-*-defined.txt
            snes9x2005-*-sections.txt
            snes9x2005-*-summary.txt
            undefined-diff.txt
            archive-sha256.txt
          retention-days: 30
