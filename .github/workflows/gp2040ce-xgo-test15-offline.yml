name: GP2040-CE XGO Test15 offline candidate validation

on:
  workflow_dispatch:
  push:
    branches:
      - research-gp2040ce-xgo-integration
    paths:
      - '.github/workflows/gp2040ce-xgo-test15-offline.yml'
      - 'integrations/gp2040ce-xgo-test01/candidates/test15-offline/**'
      - 'integrations/gp2040ce-xgo-test01/tests/test15_candidate_static_gates.py'

permissions:
  contents: read

jobs:
  compile-offline-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated candidate invariants
        run: |
          python3 integrations/gp2040ce-xgo-test01/tests/test15_candidate_static_gates.py
          python3 integrations/gp2040ce-xgo-test01/tests/test14_snapshot_contract_model.py
          python3 integrations/gp2040ce-xgo-test01/tests/test14_phy_transaction_model.py
          python3 integrations/gp2040ce-xgo-test01/tests/test14_consecutive_load_model.py
          python3 integrations/gp2040ce-xgo-test01/tests/test14_temporal_rearm_model.py
          python3 integrations/gp2040ce-xgo-test01/tests/test14_snapshot_latency_counterexamples.py
          python3 integrations/gp2040ce-xgo-test01/tests/test14_host_waveform_model.py
          python3 integrations/gp2040ce-xgo-test01/tests/test14_multiframe_fault_classifier.py
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi python3 python3-pip protobuf-compiler
      - name: Clone pinned firmware and SDK
        run: |
          git clone https://github.com/OpenStickCommunity/GP2040-CE.git upstream
          git -C upstream checkout 3d1f32f7d02d418826b725b60208278d3be878c3
          git -C upstream submodule update --init --recursive
          git clone --branch 2.3.1 --depth 1 https://github.com/raspberrypi/pico-sdk.git pico-sdk
          git -C pico-sdk submodule update --init --recursive
      - name: Apply and audit protected Test14 overlay before candidate substitution
        run: |
          python3 integrations/gp2040ce-xgo-test01/preflight.py upstream
          python3 integrations/gp2040ce-xgo-test01/apply.py upstream
          python3 integrations/gp2040ce-xgo-test01/validate_generated_headers.py upstream
          python3 integrations/gp2040ce-xgo-test01/audit_test14.py upstream
          cmp integrations/gp2040ce-xgo-test01/src/drivers/xgo/XGODriver.cpp upstream/src/drivers/xgo/XGODriver.cpp
      - name: Substitute isolated candidate only inside temporary upstream checkout
        run: |
          cp integrations/gp2040ce-xgo-test01/candidates/test15-offline/XGODriver.cpp upstream/src/drivers/xgo/XGODriver.cpp
          test "$(sha256sum upstream/src/drivers/xgo/XGODriver.cpp | cut -d' ' -f1)" = "$(sha256sum integrations/gp2040ce-xgo-test01/candidates/test15-offline/XGODriver.cpp | cut -d' ' -f1)"
      - name: Configure and compile
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
          GP2040_BOARDCONFIG: Pico
        run: |
          cmake -S upstream -B upstream/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build upstream/build --parallel 2
      - name: Collect clearly labeled offline-only artifact
        run: |
          mkdir -p xgo-test15-offline
          find upstream/build -name '*.uf2' -type f -exec cp -t xgo-test15-offline/ {} +
          test "$(find xgo-test15-offline -maxdepth 1 -name '*.uf2' -type f | wc -l)" -eq 1
          (cd xgo-test15-offline && sha256sum ./*.uf2 > SHA256SUMS.txt)
          printf 'UNVALIDATED OFFLINE CANDIDATE - DO NOT FLASH WITHOUT REVIEW\n' > xgo-test15-offline/README-DO-NOT-FLASH.txt
      - uses: actions/upload-artifact@v4
        with:
          name: xgo-gp2040ce-test15-OFFLINE-UNVALIDATED-DO-NOT-FLASH
          path: xgo-test15-offline/
