name: XGO fast offline serial regression

on:
  workflow_dispatch:
  push:
    branches:
      - research-gp2040ce-xgo-integration
    paths:
      - '.github/workflows/gp2040ce-xgo-fast-serial-offline.yml'
      - 'integrations/gp2040ce-xgo-test01/tests/test_serial_boundary_faults_offline.py'
      - 'integrations/gp2040ce-xgo-test01/tests/test_responder_compiled_mock.py'
      - 'integrations/gp2040ce-xgo-test01/tests/test_exact_xgo_frame_phase.py'
      - 'integrations/gp2040ce-xgo-test01/tests/test_exact_xgo_rearm_two_frames.py'
      - 'integrations/gp2040ce-xgo-test01/tests/test_xgo_irq_stretched_clock_exact_cpp.py'
      - 'integrations/gp2040ce-xgo-test01/tests/test_p0_measured_short_clock_high_exact_cpp.py'
      - 'integrations/gp2040ce-xgo-test01/tests/test_responder_free_running_clock.py'
      - 'integrations/gp2040ce-xgo-test01/tests/test_slot0_release_settle_offline.py'
      - 'integrations/gp2040ce-xgo-test01/tests/test_armv6m_atomic_codegen.py'
      - 'integrations/gp2040ce-xgo-test01/tests/test_ram_audit_veneer_resolution.py'
      - 'integrations/gp2040ce-xgo-test01/tests/test_spsc_attack_generations.py'
      - 'integrations/gp2040ce-xgo-test01/candidates/offline-spsc-ram-hotpath/**'
      - 'integrations/gp2040ce-xgo-test01/candidates/offline-test44-spsc-ram-playable/**'
      - 'integrations/gp2040ce-xgo-test01/candidates/offline-test44-spsc-coherent-ram/**'
      - 'integrations/gp2040ce-xgo-test01/tests/test_spsc_chord_atomicity.py'
      - 'integrations/gp2040ce-xgo-test01/candidates/offline-test44-spsc-xy-native-turbo-hold/**'
      - 'integrations/gp2040ce-xgo-test01/tests/test_xgo_native_xy_turbo.py'
      - 'integrations/gp2040ce-xgo-test01/tests/test_nes_jump_origins.py'
      - 'integrations/gp2040ce-xgo-test01/tests/test_passive_phy_jump_baseline.py'
      - 'integrations/gp2040ce-xgo-test01/tests/test_current_phy_passive_ghost_comparator.py'
      - 'integrations/gp2040ce-xgo-test01/tests/test_controller_transparency_contract.py'
      - 'integrations/gp2040ce-xgo-test01/tests/test_transparent_controller_end_to_end.py'
      - 'integrations/gp2040ce-xgo-test01/tests/test_transparent_ui.py'
      - 'integrations/gp2040ce-xgo-test01/candidates/offline-test44-transparent-controller/**'
      - 'integrations/gp2040ce-xgo-test01/candidates/offline-transparent-page-oled/**'
      - 'integrations/gp2040ce-xgo-test01/tests/test_xgo_oled_page_cpp.py'
      - 'integrations/gp2040ce-xgo-test01/CONTROLLER-TRANSPARENCY-CONTRACT.md'
      - 'integrations/gp2040ce-xgo-test01/tests/test_test44_spsc_lineage.py'
      - 'integrations/gp2040ce-xgo-test01/tests/audit_ram_hotpath_elf.py'
      - 'integrations/gp2040ce-xgo-test01/tests/test49_attack_edge_provenance.py'
      - 'integrations/gp2040ce-xgo-test01/candidates/offline-terminal-postamble/**'
      - 'integrations/gp2040ce-xgo-test01/candidates/test49-attack-edge-provenance/XGODriver.cpp'
      - 'integrations/gp2040ce-xgo-test01/candidates/test50-pause-edge-provenance/XGODriver.cpp'
      - 'tools/rp2040-xgo-p0/analyze_frames.py'
      - 'tools/rp2040-xgo-p0/test_analyze_frames.py'
      - 'tools/xgo-protocol-audit/audit_fc_keymap.py'
      - 'tools/xgo-protocol-audit/test_audit_fc_keymap.py'
      - 'integrations/gp2040ce-xgo-test01/tests/verify_xgo_data_line_bias_contract.py'
      - 'tools/rp2040-xgo-live-controller/main.c'
      - 'tools/rp2040-xgo-native-contra/main.c'

permissions:
  contents: read
  statuses: write

jobs:
  serial-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inventory preinstalled ARM and C++ toolchains
        run: |
          command -v clang || true
          clang --version | head -n 1 || true
          command -v arm-none-eabi-gcc || true
          arm-none-eabi-gcc --version | head -n 1 || true
          command -v arm-none-eabi-objdump || true
          command -v cmake || true
          command -v ninja || true
      - name: Verify Test49 edge model and serial boundary regressions
        run: |
          python3 integrations/gp2040ce-xgo-test01/tests/test49_attack_edge_provenance.py
          python3 integrations/gp2040ce-xgo-test01/tests/test_serial_boundary_faults_offline.py
          python3 integrations/gp2040ce-xgo-test01/tests/test_responder_compiled_mock.py
          python3 integrations/gp2040ce-xgo-test01/tests/test_exact_xgo_frame_phase.py
          python3 integrations/gp2040ce-xgo-test01/tests/test_exact_xgo_rearm_two_frames.py
          python3 integrations/gp2040ce-xgo-test01/tests/test_xgo_irq_stretched_clock_exact_cpp.py
          python3 integrations/gp2040ce-xgo-test01/tests/test_p0_measured_short_clock_high_exact_cpp.py
          python3 tools/rp2040-xgo-p0/test_analyze_frames.py
          python3 tools/xgo-protocol-audit/test_audit_fc_keymap.py
          python3 integrations/gp2040ce-xgo-test01/tests/verify_xgo_data_line_bias_contract.py
          python3 integrations/gp2040ce-xgo-test01/tests/test_responder_free_running_clock.py
          python3 integrations/gp2040ce-xgo-test01/tests/test_slot0_release_settle_offline.py
          python3 integrations/gp2040ce-xgo-test01/tests/test_armv6m_atomic_codegen.py
          python3 integrations/gp2040ce-xgo-test01/tests/test_ram_audit_veneer_resolution.py
          python3 integrations/gp2040ce-xgo-test01/tests/test_spsc_attack_generations.py
          python3 integrations/gp2040ce-xgo-test01/tests/test_test44_spsc_lineage.py
          python3 integrations/gp2040ce-xgo-test01/tests/test_spsc_chord_atomicity.py
          python3 integrations/gp2040ce-xgo-test01/tests/test_xgo_native_xy_turbo.py
          python3 integrations/gp2040ce-xgo-test01/tests/test_nes_jump_origins.py
          python3 integrations/gp2040ce-xgo-test01/tests/test_passive_phy_jump_baseline.py
          python3 integrations/gp2040ce-xgo-test01/tests/test_current_phy_passive_ghost_comparator.py
          python3 integrations/gp2040ce-xgo-test01/tests/test_controller_transparency_contract.py
          python3 integrations/gp2040ce-xgo-test01/tests/test_controller_transparency_contract.py --candidate integrations/gp2040ce-xgo-test01/candidates/offline-test44-transparent-controller/XGODriver.cpp
          python3 integrations/gp2040ce-xgo-test01/tests/test_transparent_ui.py
          python3 integrations/gp2040ce-xgo-test01/tests/test_transparent_controller_end_to_end.py
          python3 integrations/gp2040ce-xgo-test01/tests/test_xgo_oled_page_cpp.py
      - name: Report fast regression result for downstream review
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$RESULT" = success ]; then STATE=success; else STATE=failure; fi
          export STATE
          python3 - <<'PYJSON' > /tmp/xgo-fast-serial-status.json
          import json, os
          print(json.dumps({"state":os.environ["STATE"],
                            "context":"xgo-fast-serial/verified-models",
                            "description":"Fast source contract and fault models " + os.environ["STATE"],
                            "target_url":f"https://github.com/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}"}))
          PYJSON
          curl --fail-with-body --retry 3 -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            --data-binary @/tmp/xgo-fast-serial-status.json
