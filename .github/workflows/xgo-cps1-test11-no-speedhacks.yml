name: XGO CPS1 Test11 no speedhacks

on:
  push:
    branches: [ research-post-mapper-runtime ]
    paths:
      - '.github/workflows/xgo-cps1-test11-no-speedhacks.yml'
      - 'tools/multicore/native_cps1/**'
      - 'tools/multicore/native_nes/**'
      - 'tools/multicore/xgo_minimal_environment_shim.c'
      - 'tools/multicore/xgo_preloaded_rom_sbrk.c'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld llvm perl

      - name: Install HC15xx toolchain
        run: |
          set -euxo pipefail
          url='https://cloud.maschath.de/s/dDrZN4DSgJ33E3w/download/Codescape.GNU.Tools.Package.2019.09-03-2.for.MIPS32.MTI.Bare.Metal.Ubuntu-18.04.5.x86_64.tar.gz'
          curl -fL --retry 3 --retry-delay 2 "$url" -o /tmp/codescape-mips32.tar.gz
          sudo tar -xzf /tmp/codescape-mips32.tar.gz -C /opt

      - name: Fetch pinned FBA2012 CPS1 and disable speedhacks
        run: |
          set -euxo pipefail
          git clone --recursive https://github.com/madcock/fbalpha2012_cps1.git /tmp/cps1
          cd /tmp/cps1
          git checkout 5714c8dc311f4dda6e54533bc8dd901a29700635
          git submodule update --init --recursive
          sed -i 's/-DUSE_SPEEDHACKS //' makefile.libretro
          if grep -q 'DUSE_SPEEDHACKS' makefile.libretro; then
            echo 'speedhack define still present' >&2
            exit 1
          fi
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/core-commit.txt"

      - name: Build FBA2012 CPS1
        run: |
          set -euxo pipefail
          cd /tmp/cps1
          mkdir -p src/dep/generated
          perl src/dep/scripts/gamelist.pl -o src/dep/generated/driverlist.h -l gamelist.txt src/burn/drv/capcom
          make -j2 platform=sf2000
          cp fbalpha2012_cps1_libretro_sf2000.a "$GITHUB_WORKSPACE/fbalpha2012_cps1_nospeedhack.a"

      - name: Compile XGO runtime
        run: |
          set -euxo pipefail
          cc=/opt/mips32-mti-elf/2019.09-03-2/bin/mips-mti-elf-gcc
          flags='-EL -march=mips32 -mtune=mips32 -msoft-float -G0 -mno-abicalls -fno-pic -ffunction-sections -fdata-sections -fno-stack-protector -O2 -DXGO_WITH_NEWLIB -Itools/multicore/include -I/tmp/cps1/src/burner/libretro/libretro-common/include'
          "$cc" $flags -c tools/multicore/native_nes/xgo_core_entry.s -o core_entry.o
          "$cc" $flags -c tools/multicore/native_nes/xgo_gp_bridges.s -o gp_bridges.o
          "$cc" $flags -c tools/multicore/native_cps1/xgo_cps1_native_frontend.c -o frontend.o
          "$cc" $flags -c tools/multicore/native_cps1/xgo_cps1_environment.c -o cps1_environment.o
          "$cc" $flags -c tools/multicore/native_nes/xgo_libretro_state.c -o state.o
          "$cc" $flags -c tools/multicore/xgo_minimal_environment_shim.c -o environment.o
          "$cc" $flags -c tools/multicore/xgo_preloaded_rom_sbrk.c -o sbrk.o
          "$cc" $flags -include tools/multicore/native_nes/xgo_stock_gp_redirects.h -c tools/multicore/native_nes/xgo_newlib_syscalls.c -o syscalls.o

      - name: Link Test11 XGOC
        run: |
          set -euxo pipefail
          tools=/opt/mips32-mti-elf/2019.09-03-2/bin
          cxx="$tools/mips-mti-elf-g++"
          nm="$tools/mips-mti-elf-nm"
          objcopy="$tools/mips-mti-elf-objcopy"

          "$cxx" -EL -march=mips32 -msoft-float -G0 -mno-abicalls -fno-pic -static -nostartfiles             -Wl,--gc-sections -Wl,-Map,xgo-cps1-test11.map             -Wl,-T,tools/multicore/native_nes/xgo_core.ld             -Wl,-T,tools/multicore/native_nes/xgo_external_stock_services.ld             core_entry.o gp_bridges.o frontend.o cps1_environment.o state.o environment.o sbrk.o syscalls.o             -Wl,--start-group fbalpha2012_cps1_nospeedhack.a -lstdc++ -lc -lm -lgcc -Wl,--end-group             -o xgo-cps1-test11.elf

          "$nm" -u xgo-cps1-test11.elf | tee undefined.txt
          test ! -s undefined.txt
          "$nm" -n xgo-cps1-test11.elf > symbols.txt
          "$objcopy" -O binary xgo-cps1-test11.elf xgo-cps1-test11.bin

          start=$((0x87000000))
          image_end_hex=$("$nm" -n xgo-cps1-test11.elf | awk '$3=="__image_end"{h=$1; if(length(h)>8) h=substr(h,length(h)-7); print h; exit}')
          image_end=$((16#$image_end_hex))
          memory_size=$((image_end-start))

          python3 tools/multicore/probe/pack_xgoc.py             xgo-cps1-test11.bin core-fbalpha2012-cps1-test11-nospeedhacks.xgc             --entry-offset 0 --memory-size "$memory_size"
          python3 tools/multicore/probe/inspect_xgoc.py core-fbalpha2012-cps1-test11-nospeedhacks.xgc | tee inspect.txt
          sha256sum core-fbalpha2012-cps1-test11-nospeedhacks.xgc | tee output.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: xgo-cps1-test11-no-speedhacks
          path: |
            core-fbalpha2012-cps1-test11-nospeedhacks.xgc
            undefined.txt
            inspect.txt
            output.sha256
          retention-days: 30
