name: XGO stock scheduler inplace proof

on:
  push:
    branches: [ research-post-mapper-runtime ]
    paths:
      - '.github/workflows/xgo-stock-scheduler-inplace-proof.yml'
  workflow_dispatch:

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - name: Install MIPS binutils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-mips-linux-gnu

      - name: Assemble fixed-address scheduler helper
        shell: bash
        run: |
          cat > scheduler.S <<'ASM'
          .set noreorder
          .set noat
          .text

          .section .main_sched,"ax",@progbits
          .globl main_sched
          main_sched:
              jal   0x8030fec8              # os_get_tick_count
              nop
              lw    $t1,-3328($gp)          # scheduler_start_tick
              subu  $t2,$v0,$t1             # elapsed
              lw    $t3,-30284($gp)         # target_fps
              multu $t2,$t3
              mflo  $t4
              addiu $t5,$zero,1000
              divu  $t4,$t5
              mflo  $t6                     # ideal_frame
              lw    $t7,-30280($gp)         # completed_frame_count
              addiu $t8,$t7,1               # next_frame
              sltu  $t9,$t6,$t8             # ideal < next ?
              bnez  $t9,early_wait
              nop

              sw    $t8,-30280($gp)         # completed = next
              lw    $t0,-30304($gp)         # catchup_count
              sltu  $t1,$t8,$t6             # next < ideal
              sltiu $t2,$t0,3               # catchup < 3
              and   $t1,$t1,$t2
              bnez  $t1,catchup
              addiu $t0,$t0,1               # ignored on reset path

          reset_catchup:
              sw    $zero,-30304($gp)
              sw    $t6,-30280($gp)         # snap completed to ideal
              sw    $zero,-3300($gp)        # frameskip = 0
              j     0x8035ef70               # stock gfn_frameskip dispatch
              nop

          catchup:
              sw    $t0,-30304($gp)
              addiu $t1,$zero,1
              sw    $t1,-3300($gp)          # frameskip = 1
              j     0x8035ef70
              nop

          .section .early_sched,"ax",@progbits
          .globl early_wait
          early_wait:
              jal   0x8030f480               # dly_tsk
              addiu $a0,$zero,1             # delay slot
              j     main_sched
              nop
          ASM

          cat > scheduler.ld <<'LD'
          SECTIONS
          {
            . = 0x8035eee8;
            .main_sched : { *(.main_sched) }
            . = 0x8035f060;
            .early_sched : { *(.early_sched) }
          }
          LD

          mips-linux-gnu-as -EL -mips32 -o scheduler.o scheduler.S
          mips-linux-gnu-ld -EL -T scheduler.ld -o scheduler.elf scheduler.o
          mips-linux-gnu-objdump -d scheduler.elf | tee scheduler-disassembly.txt
          mips-linux-gnu-nm -n scheduler.elf | tee scheduler-symbols.txt
          mips-linux-gnu-objcopy -O binary scheduler.elf scheduler.bin

      - name: Verify exact fit and branch targets
        shell: bash
        run: |
          python3 - <<'PY' | tee scheduler-proof.txt
          import re, subprocess, pathlib, sys
          nm=subprocess.check_output(['mips-linux-gnu-nm','-n','scheduler.elf'],text=True)
          syms={}
          for line in nm.splitlines():
              p=line.split()
              if len(p)>=3:
                  syms[p[2]]=int(p[0],16)
          obj=subprocess.check_output(['mips-linux-gnu-objdump','-h','scheduler.elf'],text=True)
          secs={}
          for line in obj.splitlines():
              m=re.match(r'\s*\d+\s+(\.\S+)\s+([0-9a-fA-F]+)\s+([0-9a-fA-F]+)',line)
              if m:
                  secs[m.group(1)]=(int(m.group(2),16),int(m.group(3),16))
          print('symbols=',syms)
          print('sections=',secs)
          main_size,main_vma=secs['.main_sched']
          early_size,early_vma=secs['.early_sched']
          print(f'main:  start=0x{main_vma:08x} size=0x{main_size:x} end=0x{main_vma+main_size:08x}')
          print(f'early: start=0x{early_vma:08x} size=0x{early_size:x} end=0x{early_vma+early_size:08x}')
          assert main_vma==0x8035eee8
          assert main_vma+main_size <= 0x8035ef70
          assert early_vma==0x8035f060
          assert early_vma+early_size <= 0x8035f090
          print('FIT=PASS')
          PY

      - name: Preserve static proof
        uses: actions/upload-artifact@v4
        with:
          name: xgo-stock-scheduler-inplace-proof
          path: |
            scheduler-disassembly.txt
            scheduler-symbols.txt
            scheduler-proof.txt
            scheduler.elf
            scheduler.bin
          retention-days: 30
