name: Build XGO P6 raw-pad controller
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi
      - run: |
          git clone --depth 1 --branch 1.5.1 https://github.com/raspberrypi/pico-sdk.git "$RUNNER_TEMP/pico-sdk"
          git -C "$RUNNER_TEMP/pico-sdk" submodule update --init --recursive
      - name: Configure
        env:
          PICO_SDK_PATH: ${{ runner.temp }}/pico-sdk
        run: cmake -S tools/rp2040-xgo-p6-rawpad-controller -B build/p6 -G Ninja -DPICO_BOARD=pico -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/p6
      - run: "! grep -R -E 'tud_init|tusb_init|stdio_usb_init' build/p6/*.map"
      - run: sha256sum build/p6/xgo_p6_rawpad_controller.uf2
      - uses: actions/upload-artifact@v4
        with:
          name: xgo-p6-rawpad-controller
          path: build/p6/xgo_p6_rawpad_controller.uf2
