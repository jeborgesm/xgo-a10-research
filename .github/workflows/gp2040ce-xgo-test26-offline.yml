name: GP2040-CE XGO Test26 offline validation

on:
  workflow_dispatch:
  push:
    branches:
      - research-gp2040ce-xgo-integration
    paths:
      - '.github/workflows/gp2040ce-xgo-test26-offline.yml'
      - 'integrations/gp2040ce-xgo-test01/candidates/test26-hk-sequencer-offline/**'
      - 'integrations/gp2040ce-xgo-test01/diagnostics/**'
      - 'integrations/gp2040ce-xgo-test01/tests/test26_controls_static.py'
      - 'integrations/gp2040ce-xgo-test01/tests/test26_process_behavior.cpp'

permissions:
  contents: read

jobs:
  test-and-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Test realtime input contract and candidate invariants
        run: |
          g++ -std=c++17 -Wall -Wextra -pedantic integrations/gp2040ce-xgo-test01/diagnostics/test_hk_sequencer.cpp -o /tmp/test_hk && /tmp/test_hk
          python3 integrations/gp2040ce-xgo-test01/tests/test26_controls_static.py
          g++ -std=c++17 -Wall -Wextra -pedantic integrations/gp2040ce-xgo-test01/tests/test26_process_behavior.cpp -o /tmp/test26_behavior && /tmp/test26_behavior
          python3 integrations/gp2040ce-xgo-test01/tests/test16_candidate_static_gates.py
          python3 integrations/gp2040ce-xgo-test01/tests/test14_snapshot_contract_model.py
          python3 integrations/gp2040ce-xgo-test01/tests/test14_phy_transaction_model.py
          python3 integrations/gp2040ce-xgo-test01/tests/test14_consecutive_load_model.py
          python3 integrations/gp2040ce-xgo-test01/tests/test14_temporal_rearm_model.py
          python3 integrations/gp2040ce-xgo-test01/tests/test14_host_waveform_model.py
          python3 integrations/gp2040ce-xgo-test01/tests/test14_multiframe_fault_classifier.py
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi python3 python3-pip protobuf-compiler
      - name: Clone pinned firmware and SDK
        run: |
          git clone https://github.com/OpenStickCommunity/GP2040-CE.git upstream
          git -C upstream checkout 3d1f32f7d02d418826b725b60208278d3be878c3
          git -C upstream submodule update --init --recursive
          git clone --branch 2.3.1 --depth 1 https://github.com/raspberrypi/pico-sdk.git pico-sdk
          git -C pico-sdk submodule update --init --recursive
      - name: Apply and audit protected Test14 overlay
        run: |
          python3 integrations/gp2040ce-xgo-test01/preflight.py upstream
          python3 integrations/gp2040ce-xgo-test01/apply.py upstream
          python3 integrations/gp2040ce-xgo-test01/validate_generated_headers.py upstream
          python3 integrations/gp2040ce-xgo-test01/audit_test14.py upstream
          cmp integrations/gp2040ce-xgo-test01/src/drivers/xgo/XGODriver.cpp upstream/src/drivers/xgo/XGODriver.cpp
      - name: Substitute isolated Test26 only in temporary checkout
        run: |
          cp integrations/gp2040ce-xgo-test01/candidates/test26-hk-sequencer-offline/XGODriver.cpp upstream/src/drivers/xgo/XGODriver.cpp
          cmp integrations/gp2040ce-xgo-test01/candidates/test26-hk-sequencer-offline/XGODriver.cpp upstream/src/drivers/xgo/XGODriver.cpp
      - name: Reserve SELECT START R1 for XGO diagnostic only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('upstream/src/addons/neopicoleds.cpp')
          s = p.read_text()
          needle = 'else if (gamepad->pressedR1())'
          assert s.count(needle) == 1, 'LED hotkey branch changed upstream'
          s = s.replace(needle, 'else if (gamepad->getOptions().inputMode != INPUT_MODE_XGO && gamepad->pressedR1())')
          p.write_text(s)
          assert s.count('inputMode != INPUT_MODE_XGO && gamepad->pressedR1()') == 1
          PY
      - name: Show diagnostic phase on XGO OLED status bar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('upstream/src/display/ui/screens/ButtonLayoutScreen.cpp')
          s = p.read_text()
          anchor = 'case INPUT_MODE_XGO: statusBar += "XGO"; break;'
          assert s.count(anchor) == 1, 'OLED status bar anchor mismatch'
          s = '#include <atomic>\nextern std::atomic<uint32_t> xgo_hk_phase_state;\nextern std::atomic<uint32_t> xgo_hk_repeat_state;\n' + s
          replacement = '''case INPUT_MODE_XGO: {
              const unsigned phase = xgo_hk_phase_state.load(std::memory_order_relaxed);
              const unsigned repeat = xgo_hk_repeat_state.load(std::memory_order_relaxed);
              if (phase == 0) statusBar += "XGO";
              else if (phase == 1) statusBar += "HK ARMED";
              else statusBar += "HK P" + std::to_string(phase - 1) + " R" + std::to_string(repeat);
              break;
          }'''
          p.write_text(s.replace(anchor, replacement))
          PY
      - name: Compile candidate
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
          GP2040_BOARDCONFIG: Pico
        run: |
          cmake -S upstream -B upstream/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build upstream/build --parallel 2
      - name: Package clearly labeled offline-only artifact
        run: |
          mkdir -p xgo-test26-offline
          find upstream/build -name '*.uf2' -type f -exec cp -t xgo-test26-offline/ {} +
          test "$(find xgo-test26-offline -maxdepth 1 -name '*.uf2' -type f | wc -l)" -eq 1
          (cd xgo-test26-offline && sha256sum ./*.uf2 > SHA256SUMS.txt)
          printf 'UNVALIDATED TEST25 OFFLINE CANDIDATE - DO NOT FLASH WITHOUT REVIEW\n' > xgo-test26-offline/README-DO-NOT-FLASH.txt
      - uses: actions/upload-artifact@v4
        with:
          name: xgo-gp2040ce-test26-OFFLINE-UNVALIDATED-DO-NOT-FLASH
          path: xgo-test26-offline/
