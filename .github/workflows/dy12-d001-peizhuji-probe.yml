name: DY12 D001 / DY19 Peizhuji recovery probe

on:
  pull_request:
    paths:
      - '.github/workflows/dy12-d001-peizhuji-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Peizhuji resource archive
        shell: bash
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import urllib.request,re,html,urllib.parse
          hdr={'User-Agent':'Mozilla/5.0'}
          url='https://www.peizhuji.com/sitemap/map.html'
          try:
              req=urllib.request.Request(url,headers=hdr)
              text=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','replace')
          except Exception as e:
              print('SITEMAP FETCH BLOCKED/TIMED OUT:',repr(e))
              print('Search-engine indexes remain the fallback evidence source; this is non-fatal.')
              raise SystemExit(0)
          print('sitemap bytes',len(text))
          targets=[
            'DY19抖音网红充电宝游戏机TF卡数据包全部游戏下载',
            'DY12拾光充电宝抖音网红掌上游戏机TF卡所有游戏数据包',
          ]
          for target in targets:
              print('\nTARGET',target)
              found=[]
              for m in re.finditer(r'<a\\b[^>]*href=[\"\\\']([^\"\\\']+)[\"\\\'][^>]*>(.*?)</a>',text,re.I|re.S):
                  href=html.unescape(m.group(1))
                  label=re.sub(r'<[^>]+>','',m.group(2))
                  label=html.unescape(label).strip()
                  if target in label or target[:12] in label:
                      found.append((href,label))
              print('FOUND',found)
              for href,label in found:
                  pageurl=urllib.parse.urljoin(url,href)
                  print('RESOURCE_URL',pageurl)
                  try:
                      page=urllib.request.urlopen(urllib.request.Request(pageurl,headers=hdr),timeout=20).read().decode('utf-8','replace')
                  except Exception as e:
                      print('RESOURCE FETCH ERROR',repr(e)); continue
                  for lm in re.finditer(r'href=[\"\\\']([^\"\\\']+)[\"\\\']',page,re.I):
                      u=html.unescape(lm.group(1))
                      if any(k in u.lower() for k in ['pan.','cloud.','189.cn','baidu','lanzou','123pan','quark','download']):
                          print('OUTBOUND',urllib.parse.urljoin(pageurl,u))
          PY
