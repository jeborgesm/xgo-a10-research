<text x="72" y="591" font-family="Arial" font-size="21" font-weight="bold" fill="#76500e">ASSEMBLY / SAFETY NOTES</text>
<text x="73" y="623" font-family="Arial" font-size="16" fill="#533f1d">• This is a PHYSICAL PAD map, not canonical USB pin numbering.</text><text x="73" y="647" font-family="Arial" font-size="16" fill="#533f1d">• The pad 2 ↔ pad 4 shared WHITE connection is essential to the proven cable.</text><text x="73" y="671" font-family="Arial" font-size="16" fill="#533f1d">• Working build: Frankie V2 Jr; Pico powered, successful-frame heartbeat, LEFT/RIGHT control.</text><text x="73" y="695" font-family="Arial" font-size="16" fill="#533f1d">• XGO measured supply in proven setup ≈ 3.15 V; do not substitute a 5 V assumption.</text><text x="73" y="719" font-family="Arial" font-size="16" fill="#533f1d">• Verify pad orientation and continuity with power OFF before connecting.</text><text x="73" y="743" font-family="Arial" font-size="16" fill="#533f1d">• Ordinary four-wire and commercial Micro-B cables did NOT reproduce this behavior.</text>
<text x="45" y="804" font-family="Arial" font-size="13" fill="#607385">Source: findings/rp2040-xgo-frankie-cable-contract.md • XGO A10 research • Revision: evidence-preserving</text>
